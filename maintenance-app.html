<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مركز الصيانة">
<title>مركز الصيانة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#f1f5f9;font-family:'Cairo',Tahoma,sans-serif;direction:rtl}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#f1f5f9;position:relative}
#header{background:#0f172a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);min-height:52px}
#header.hidden{display:none}
#back-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-size:18px;font-family:inherit}
#header-title{font-weight:900;font-size:17px}
#content{flex:1;overflow-y:auto;padding:16px 14px 90px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.08)}
.nav-btn{flex:1;padding:10px 2px 8px;border:none;background:transparent;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-icon{font-size:18px}.nav-label{font-size:9px;font-weight:500;color:#94a3b8}
.nav-btn.active .nav-label{font-weight:800;color:#2563eb}
.nav-dot{width:18px;height:2.5px;background:#2563eb;border-radius:2px;margin-top:1px;display:none}
.nav-btn.active .nav-dot{display:block}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:22px;padding:22px 18px;margin-bottom:16px;color:#fff;text-align:center}
.stats-row{display:flex;gap:10px;margin-bottom:10px}
.stat-card{flex:1;border-radius:16px;padding:15px 14px;color:#fff;cursor:pointer;min-width:0}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{border:none;border-radius:16px;padding:20px 12px;cursor:pointer;text-align:center;font-family:inherit}
.quick-btn:active{transform:scale(.96)}
.card{background:#fff;border-radius:16px;padding:15px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #e2e8f0;padding-bottom:8px}
.card-title{font-weight:900;font-size:16px;color:#0f172a}
.alert-card{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer}
.screen-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.screen-title{font-size:20px;font-weight:900;margin:0}
.search-input{width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;margin-bottom:12px;font-family:inherit;direction:rtl;background:#f8fafc;outline:none}
.search-input:focus{border-color:#3b82f6}
.item-name{font-weight:800;font-size:16px;color:#0f172a}
.item-sub{font-size:13px;color:#64748b;margin-top:4px}
.badge{border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.empty{text-align:center;color:#94a3b8;padding:40px 0;font-size:15px}
.btn{border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.8}.btn:disabled{background:#e2e8f0!important;color:#94a3b8!important;cursor:not-allowed}
.btn-primary{background:#2563eb;color:#fff;padding:13px 22px}
.btn-green{background:#16a34a;color:#fff;padding:13px 22px}
.btn-purple{background:#7c3aed;color:#fff;padding:13px 22px}
.btn-orange{background:#ea580c;color:#fff;padding:13px 22px}
.btn-red{background:#dc2626;color:#fff;padding:13px 22px}
.btn-teal{background:#0d9488;color:#fff;padding:13px 22px}
.btn-outline{background:transparent;color:#64748b;border:2px solid #64748b;padding:11px 20px}
.btn-sm{padding:9px 16px;font-size:13px}
.btn-full{width:100%}
.btn-add{background:#2563eb;color:#fff;padding:9px 16px;font-size:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;cursor:pointer}
.btn-ic{border:none;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:#64748b;margin-bottom:5px;font-weight:700}
.field input,.field select{width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;direction:rtl;background:#f8fafc;outline:none}
.field input:focus,.field select:focus{border-color:#3b82f6}
.required{color:#ef4444;margin-right:3px}
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;right:0;left:0;background:#fff;border:2px solid #3b82f6;border-top:none;border-radius:0 0 12px 12px;z-index:500;max-height:160px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.autocomplete-item{padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-family:inherit}
.autocomplete-item:active{background:#dbeafe}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:22px 18px 32px;direction:rtl}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800;color:#0f172a}
.modal-close{background:#f1f5f9;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.modal-actions{display:flex;gap:8px;margin-top:8px}
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:24px}
#confirm-overlay.open{display:flex}
#confirm-box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:320px;direction:rtl;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#confirm-msg{font-size:16px;font-weight:600;color:#0f172a;margin:12px 0 20px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:700;z-index:3000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:320px;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#e2e8f0;border-radius:12px;padding:4px}
.tab{flex:1;padding:8px;border:none;border-radius:9px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:#64748b}
.tab.active{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.report-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9}
.report-row.indent{padding-right:14px}
.report-row span:first-child{font-size:14px;color:#374151}
.report-row span:last-child{font-size:14px;font-weight:600}
.report-row.bold span{font-weight:900}
.net-box{border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.items-list{background:#f8fafc;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.items-list-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid #e2e8f0}
.total-row{display:flex;justify-content:space-between;font-weight:900;margin-top:10px;font-size:16px;color:#0f172a}
.total-hl{background:#f0fdf4;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.settings-btn{background:#dbeafe;border:none;border-radius:12px;padding:13px 16px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;color:#1e40af;display:flex;align-items:center;gap:10px;width:100%;margin-bottom:10px}
.settings-btn.danger{background:#fee2e2;color:#dc2626}
.settings-btn.success{background:#dcfce7;color:#166534}
.bs-section-title{background:#f8fafc;padding:8px 12px;font-weight:900;font-size:12px;color:#64748b;border-radius:8px;margin-bottom:2px;letter-spacing:.5px}
.bs-row{display:flex;justify-content:space-between;padding:8px 12px;font-size:14px;border-bottom:1px solid #f8fafc}
.bs-row.total{background:#f1f5f9;font-weight:900;border-radius:8px;margin-top:4px;padding:10px 12px}
.bs-eq{text-align:center;padding:12px;background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:12px;color:#fff;margin:8px 0}
/* DEBT */
.debt-card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:10px;border-right:4px solid #dc2626}
.debt-card.supplier{border-right-color:#7c3aed}
.debt-card.paid{border-right-color:#16a34a;opacity:.7}
.payment-method-btn{flex:1;padding:10px 8px;border:2px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#f8fafc;color:#374151;text-align:center}
.payment-method-btn.active{border-color:#2563eb;background:#dbeafe;color:#1e40af}
.payment-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="header" class="hidden">
    <button id="back-btn" onclick="navigate('home')">←</button>
    <span id="header-title"></span>
  </div>
  <div id="content">
    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="hero">
        <div style="font-size:36px">🖨️</div>
        <div style="font-size:22px;font-weight:900;margin-top:6px">مركز الصيانة</div>
        <div style="font-size:13px;opacity:.6;margin-top:3px">لوحة التحكم الرئيسية</div>
      </div>
      <div class="stats-row">
        <div class="stat-card" style="background:#2563eb" onclick="navigate('sales')">
          <div style="font-size:24px">🧾</div>
          <div style="font-size:19px;font-weight:900;margin-top:5px" id="stat-sales">0 ج</div>
          <div style="font-size:11px;opacity:.85;margin-top:3px">إجمالي المبيعات</div>
        </div>
        <div class="stat-card" id="stat-profit-card" onclick="navigate('reports')">
          <div style="font-size:24px" id="stat-profit-icon">📈</div>
          <div style="font-size:19px;font-weight:900;margin-top:5px" id="stat-profit">0 ج</div>
          <div style="font-size:11px;opacity:.85;margin-top:3px">صافي الربح</div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card" style="background:#7c3aed" onclick="navigate('purchases')">
          <div style="font-size:24px">🛒</div>
          <div style="font-size:19px;font-weight:900;margin-top:5px" id="stat-purchases">0 ج</div>
          <div style="font-size:11px;opacity:.85;margin-top:3px">المشتريات</div>
        </div>
        <div class="stat-card" style="background:#dc2626" onclick="navigate('debts')">
          <div style="font-size:24px">💳</div>
          <div style="font-size:19px;font-weight:900;margin-top:5px" id="stat-debts">0 ج</div>
          <div style="font-size:11px;opacity:.85;margin-top:3px">إجمالي الديون</div>
        </div>
      </div>
      <div id="low-stock-alert"></div>
      <div class="quick-grid">
        <button class="quick-btn" style="background:#dbeafe;border:1.5px solid #2563eb22" onclick="navigate('inventory')">
          <div style="font-size:30px">📦</div><div style="font-size:13px;font-weight:800;color:#0f172a;margin-top:8px">المنتجات والمخزون</div>
        </button>
        <button class="quick-btn" style="background:#dcfce7;border:1.5px solid #16a34a22" onclick="navigate('sales')">
          <div style="font-size:30px">🧾</div><div style="font-size:13px;font-weight:800;color:#0f172a;margin-top:8px">الفواتير والمبيعات</div>
        </button>
        <button class="quick-btn" style="background:#fce7f3;border:1.5px solid #db277722" onclick="navigate('debts')">
          <div style="font-size:30px">💳</div><div style="font-size:13px;font-weight:800;color:#0f172a;margin-top:8px">الديون والسداد</div>
        </button>
        <button class="quick-btn" style="background:#fef9c3;border:1.5px solid #ca8a0422" onclick="navigate('reports')">
          <div style="font-size:30px">📊</div><div style="font-size:13px;font-weight:800;color:#0f172a;margin-top:8px">القوائم المالية</div>
        </button>
      </div>
    </div>

    <!-- INVENTORY -->
    <div id="screen-inventory" class="screen">
      <div class="screen-header">
        <h2 class="screen-title">📦 المخزون</h2>
        <button class="btn-add" onclick="openProductModal()">+ إضافة</button>
      </div>
      <input class="search-input" id="inv-search" placeholder="🔍 بحث عن منتج..." oninput="renderInventory()">
      <div id="inventory-list"></div>
    </div>

    <!-- SALES -->
    <div id="screen-sales" class="screen">
      <div class="screen-header">
        <h2 class="screen-title">🧾 المبيعات</h2>
        <button class="btn-add" onclick="openSaleModal()">+ فاتورة</button>
      </div>
      <div id="sales-list"></div>
    </div>

    <!-- PURCHASES -->
    <div id="screen-purchases" class="screen">
      <div class="screen-header">
        <h2 class="screen-title">🛒 المشتريات</h2>
        <button class="btn-add" style="background:#7c3aed" onclick="openPurchaseModal()">+ تسجيل</button>
      </div>
      <div id="purchases-list"></div>
    </div>

    <!-- DEBTS -->
    <div id="screen-debts" class="screen">
      <div class="screen-header">
        <h2 class="screen-title">💳 الديون والسداد</h2>
        <button class="btn-add" style="background:#0d9488" onclick="openDebtModal()">+ دين</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchDebtTab('customers',this)">ديون العملاء</button>
        <button class="tab" onclick="switchDebtTab('suppliers',this)">ديون الموردين</button>
        <button class="tab" onclick="switchDebtTab('manual',this)">ديون يدوية</button>
      </div>
      <div id="debts-list"></div>
    </div>

    <!-- REPORTS -->
    <div id="screen-reports" class="screen">
      <h2 class="screen-title" style="margin-bottom:14px">📊 القوائم المالية</h2>
      <div class="tabs">
        <button class="tab active" onclick="switchReportTab('income',this)">الدخل</button>
        <button class="tab" onclick="switchReportTab('balance',this)">المركز المالي</button>
        <button class="tab" onclick="switchReportTab('expenses',this)">المصروفات</button>
      </div>
      <div id="tab-income"></div>
      <div id="tab-balance" style="display:none"></div>
      <div id="tab-expenses" style="display:none"></div>
    </div>

    <!-- SETTINGS -->
    <div id="screen-settings" class="screen">
      <h2 class="screen-title" style="margin-bottom:16px">⚙️ الإعدادات</h2>
      <div class="card">
        <div class="card-header" style="border-color:#2563eb"><span class="card-title">النسخ الاحتياطي</span></div>
        <button class="settings-btn success" onclick="exportData()">📤 تصدير نسخة احتياطية</button>
        <button class="settings-btn" onclick="document.getElementById('import-file').click()">📥 استيراد نسخة احتياطية</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        <button class="settings-btn danger" onclick="confirmAction('هتمسح كل البيانات؟ مش هينفع ترجعها!',resetAll)">🗑️ مسح كل البيانات</button>
      </div>
      <div class="card">
        <div class="card-header" style="border-color:#7c3aed"><span class="card-title">الأرشيف</span></div>
        <div id="archive-content"></div>
      </div>
      <div class="card">
        <div class="card-header" style="border-color:#ea580c"><span class="card-title">إحصائيات</span></div>
        <div id="settings-stats"></div>
      </div>
      <div style="text-align:center;padding:20px 0;color:#94a3b8;font-size:12px">مركز الصيانة v4.0 — البيانات محفوظة على جهازك</div>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn active" data-screen="home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span><span class="nav-label">الرئيسية</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" data-screen="inventory" onclick="navigate('inventory')">
      <span class="nav-icon">📦</span><span class="nav-label">مخزون</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" data-screen="sales" onclick="navigate('sales')">
      <span class="nav-icon">🧾</span><span class="nav-label">مبيعات</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" data-screen="debts" onclick="navigate('debts')">
      <span class="nav-icon">💳</span><span class="nav-label">ديون</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" data-screen="reports" onclick="navigate('reports')">
      <span class="nav-icon">📊</span><span class="nav-label">تقارير</span><div class="nav-dot"></div>
    </button>
    <button class="nav-btn" data-screen="settings" onclick="navigate('settings')">
      <span class="nav-icon">⚙️</span><span class="nav-label">إعدادات</span><div class="nav-dot"></div>
    </button>
  </div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="confirm-overlay">
  <div id="confirm-box">
    <div style="font-size:36px">⚠️</div>
    <div id="confirm-msg"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-full btn-red" id="confirm-yes">تأكيد</button>
      <button class="btn btn-full btn-outline" onclick="closeConfirm()">إلغاء</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ===== DATA =====
const load=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

let DB={
  products:  load('mc4_products')||[],
  sales:     load('mc4_sales')||[],
  purchases: load('mc4_purchases')||[],
  expenses:  load('mc4_expenses')||[],
  debts:     load('mc4_debts')||[],   // {id,type:'customer'|'supplier'|'manual',name,desc,total,paid,date,payments:[{date,amount,method,note}]}
  archive:{
    customers: load('mc4_arch_customers')||[],
    suppliers: load('mc4_arch_suppliers')||[],
    products:  load('mc4_arch_products')||[],
    expDescs:  load('mc4_arch_expDescs')||[],
  }
};

const persist=()=>{
  save('mc4_products',DB.products); save('mc4_sales',DB.sales);
  save('mc4_purchases',DB.purchases); save('mc4_expenses',DB.expenses);
  save('mc4_debts',DB.debts);
  save('mc4_arch_customers',DB.archive.customers);
  save('mc4_arch_suppliers',DB.archive.suppliers);
  save('mc4_arch_products',DB.archive.products);
  save('mc4_arch_expDescs',DB.archive.expDescs);
};

const addArchive=(key,val)=>{if(!val||DB.archive[key].includes(val))return;DB.archive[key].unshift(val);if(DB.archive[key].length>100)DB.archive[key].pop();};

// ===== TOAST =====
function showToast(msg,color='#0f172a'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

// ===== NAV =====
let currentScreen='home', currentReportTab='income', currentDebtTab='customers';
const navLabels={home:'الرئيسية',inventory:'مخزون',sales:'مبيعات',purchases:'مشتريات',debts:'الديون',reports:'تقارير',settings:'إعدادات'};
const navIcons={home:'🏠',inventory:'📦',sales:'🧾',purchases:'🛒',debts:'💳',reports:'📊',settings:'⚙️'};

function navigate(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
  const hdr=document.getElementById('header');
  if(screen==='home') hdr.classList.add('hidden');
  else{hdr.classList.remove('hidden');document.getElementById('header-title').textContent=navIcons[screen]+' '+navLabels[screen];}
  currentScreen=screen;
  renderScreen(screen);
  document.getElementById('content').scrollTop=0;
}

function renderScreen(s){
  if(s==='home') renderHome();
  else if(s==='inventory') renderInventory();
  else if(s==='sales') renderSales();
  else if(s==='purchases') renderPurchases();
  else if(s==='debts') renderDebts();
  else if(s==='reports') renderReports();
  else if(s==='settings') renderSettingsScreen();
}

function switchReportTab(tab,el){
  currentReportTab=tab;
  document.querySelectorAll('#screen-reports .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['income','balance','expenses'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'block':'none');
  renderReports();
}

function switchDebtTab(tab,el){
  currentDebtTab=tab;
  document.querySelectorAll('#screen-debts .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderDebts();
}

// ===== HOME =====
function renderHome(){
  const ts=DB.sales.reduce((s,x)=>s+x.total,0);
  const tp=DB.purchases.reduce((s,x)=>s+x.total,0);
  const te=DB.expenses.reduce((s,x)=>s+x.amount,0);
  const totalDebts=DB.debts.reduce((s,d)=>s+(d.total-(d.paid||0)),0);
  const profit=ts-tp-te;
  document.getElementById('stat-sales').textContent=fmt(ts);
  document.getElementById('stat-purchases').textContent=fmt(tp);
  document.getElementById('stat-profit').textContent=fmt(profit);
  document.getElementById('stat-profit-icon').textContent=profit>=0?'📈':'📉';
  document.getElementById('stat-profit-card').style.background=profit>=0?'#16a34a':'#dc2626';
  document.getElementById('stat-debts').textContent=fmt(totalDebts);

    `<div class="alert-card" onclick="navigate('inventory')"><div style="font-weight:800;color:#c2410c;margin-bottom:8px">⚠️ مخزون منخفض</div>${low.map(p=>`<div style="font-size:13px;color:#9a3412;padding:4px 0;border-bottom:1px solid #fed7aa;display:flex;justify-content:space-between"><span>${p.name}</span><b>${p.qty} ${p.unit}</b></div>`).join('')}</div>`:'';}

let _saleId=null,_saleItems=[];
function openSaleModal(id){

function renderSaleBody(s){
  const opts=DB.products.map(p=>`<option value="${p.id}">${p.name} (متوفر: ${p.qty}) — ${p.sellPrice} ج</option>`).join('');
  const itemsHtml=_saleItems.length?`<div class="items-list">${_saleItems.map((it,i)=>`

    <div style="display:flex;gap:8px;align-items:center"><b style="color:#16a34a">${it.qty*it.price} ج</b>

    <div class="total-row"><span>الإجمالي</span><span>${fmt(_saleItems.reduce((s,i)=>s+i.qty*i.price,0))}</span></div></div>`:'';
  document.getElementById('modal-body').innerHTML=`
    ${acField('sale-customer','اسم العميل','text',s?.customer||'','','customers',true)}
    ${fld('sale-date','التاريخ','date',s?.date||today())}
    <div class="field"><label>إضافة منتج</label>
      <select id="sale-prod" style="width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;direction:rtl;background:#f8fafc;margin-bottom:8px">
        <option value="">-- اختر منتج --</option>${opts}</select>
      <div style="display:flex;gap:8px">
        <input id="sale-qty" type="number" value="1" min="1" style="flex:1;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;text-align:center;background:#f8fafc">
        <button class="btn btn-primary btn-sm" onclick="addSaleItem()">إضافة</button>
      </div></div>
    ${itemsHtml}
    ${fld('sale-paid','المبلغ المدفوع (ج)','number',s?.paid||'')}
    <div class="modal-actions">
      <button class="btn btn-green btn-full" onclick="saveSale()">${s?'حفظ التعديل':'حفظ الفاتورة'}</button>
      <button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button>
    </div>`;
  initAC('sale-customer','customers');
}

function addSaleItem(){
  const pid=+document.getElementById('sale-prod').value,qty=+document.getElementById('sale-qty').value||1;
  const p=DB.products.find(x=>x.id===pid);if(!p)return;
  _saleItems.push({productId:p.id,name:p.name,qty,price:p.sellPrice});
  renderSaleBody(_saleId?DB.sales.find(x=>x.id===_saleId):null);
}
function rmSaleItem(idx){_saleItems.splice(idx,1);renderSaleBody(_saleId?DB.sales.find(x=>x.id===_saleId):null);}

function saveSale(){
  const customer=val('sale-customer');
  if(!customer||!_saleItems.length) return showToast('⚠️ اسم العميل والمنتجات مطلوبين','#dc2626');
  const total=_saleItems.reduce((s,i)=>s+i.qty*i.price,0);
  const paid=+val('sale-paid')||0;
  const status=paid>=total?'مدفوع':paid>0?'جزئي':'غير مدفوع';
  if(_saleId){
    DB.sales=DB.sales.map(s=>s.id===_saleId?{...s,customer,date:val('sale-date'),items:[..._saleItems],total,paid,status}:s);
  } else {
    DB.sales.push({id:Date.now(),customer,date:val('sale-date'),items:[..._saleItems],total,paid,status});
    _saleItems.forEach(item=>{DB.products=DB.products.map(p=>p.id===item.productId?{...p,qty:Math.max(0,p.qty-item.qty)}:p);});
    // auto-create debt if not fully paid
    if(paid<total){
      DB.debts.push({id:Date.now()+1,type:'customer',name:customer,desc:`فاتورة بيع — ${_saleItems.map(i=>i.name).join(', ')}`,total:total-paid,paid:0,date:val('sale-date'),payments:[]});
    }
  }
  addArchive('customers',customer);
  persist();closeModal();renderSales();renderHome();
  showToast(_saleId?'✅ تم تعديل الفاتورة':'✅ تم حفظ الفاتورة','#16a34a');
}

function updPurTotal(){
  const t=(+val('pur-qty')||0)*(+val('pur-price')||0);
  const box=document.getElementById('pur-total-box');
  if(t>0){box.style.display='flex';document.getElementById('pur-total-val').textContent=fmt(t);}
  else box.style.display='none';
}

function savePurchase(){
  const supplier=val('pur-supplier'),name=val('pur-name');
  if(!supplier||!name) return showToast('⚠️ المورد واسم المنتج مطلوبين','#dc2626');
  const qty=+val('pur-qty'),price=+val('pur-price'),total=qty*price,paid=+val('pur-paid')||total;
  const entry={supplier,date:val('pur-date'),items:[{name,qty,price}],total,paid};
  if(_purchId) DB.purchases=DB.purchases.map(p=>p.id===_purchId?{...p,...entry}:p);
  else{
    DB.purchases.push({id:Date.now(),...entry});
    const ex=DB.products.find(p=>p.name===name);
    if(ex) DB.products=DB.products.map(p=>p.name===name?{...p,qty:p.qty+qty}:p);
    else DB.products.push({id:Date.now(),name,unit:'قطعة',qty,minQty:2,buyPrice:price,sellPrice:Math.round(price*1.5)});
    if(paid<total) DB.debts.push({id:Date.now()+1,type:'supplier',name:supplier,desc:`مشتريات — ${name}`,total:total-paid,paid:0,date:val('pur-date'),payments:[]});
  }
  addArchive('suppliers',supplier);addArchive('products',name);
  persist();closeModal();renderPurchases();renderHome();
  showToast(_purchId?'✅ تم التعديل':'✅ تم تسجيل المشتريات','#16a34a');
}

const PAYMENT_METHODS=[
  {id:'cash',label:'نقدي',icon:'💵'},
  {id:'instapay',label:'إنستاباي',icon:'📱'},
  {id:'bank',label:'تحويل بنكي',icon:'🏦'},
  {id:'vodafone',label:'فودافون كاش',icon:'📲'},
  {id:'check',label:'شيك',icon:'📝'},
  {id:'other',label:'أخرى',icon:'🔄'},
];

function renderDebts(){
  const el=document.getElementById('debts-list');
  let list=[];
  if(currentDebtTab==='customers') list=DB.debts.filter(d=>d.type==='customer');
  else if(currentDebtTab==='suppliers') list=DB.debts.filter(d=>d.type==='supplier');
  else list=DB.debts.filter(d=>d.type==='manual');

  const pending=list.filter(d=>(d.total-(d.paid||0))>0);
  const done=list.filter(d=>(d.total-(d.paid||0))<=0);

  if(!list.length){el.innerHTML='<div class="empty">لا توجد ديون في هذا القسم</div>';return;}

  const debtCard=(d)=>{
    const remaining=d.total-(d.paid||0);
    const pct=Math.min(100,Math.round((d.paid||0)/d.total*100));
    const isPaid=remaining<=0;
    return `<div class="debt-card ${d.type==='supplier'?'supplier':''} ${isPaid?'paid':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="flex:1">
          <div style="font-weight:800;font-size:16px;color:#0f172a">${d.name}</div>
          <div style="font-size:12px;color:#94a3b8;margin-top:2px">${d.date} — ${d.desc||''}</div>
        </div>
        <div style="display:flex;gap:6px">
          ${!isPaid?`<button class="btn-ic" style="background:#d1fae5;color:#065f46" onclick="openPaymentModal(${d.id})">💳 سداد</button>`:''}
          <button class="btn-ic" style="background:#fee2e2" onclick="confirmAction('هتحذف الدين ده؟',()=>delItem('debts',${d.id},renderDebts))">🗑️</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span style="color:#64748b">إجمالي الدين: <b style="color:#0f172a">${fmt(d.total)}</b></span>
        <span style="color:#64748b">المدفوع: <b style="color:#16a34a">${fmt(d.paid||0)}</b></span>
      </div>
      <div style="background:#f1f5f9;border-radius:8px;height:8px;overflow:hidden;margin-bottom:8px">
        <div style="height:100%;width:${pct}%;background:${isPaid?'#16a34a':'#2563eb'};border-radius:8px;transition:width .3s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:#64748b">${pct}% مسدّد</span>
        <span style="font-weight:900;font-size:16px;color:${isPaid?'#16a34a':'#dc2626'}">${isPaid?'✅ مسدّد بالكامل':'متبقي '+fmt(remaining)}</span>
      </div>
      ${d.payments?.length?`<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:8px">
        <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px">سجل الدفعات</div>
        ${d.payments.slice(-3).map(p=>`<div class="payment-row">
          <span>${p.date}</span>
          <span style="color:#374151">${PAYMENT_METHODS.find(m=>m.id===p.method)?.icon||'💰'} ${PAYMENT_METHODS.find(m=>m.id===p.method)?.label||p.method}</span>
          ${p.note?`<span style="color:#94a3b8;font-size:11px">${p.note}</span>`:'<span></span>'}
          <b style="color:#16a34a">${fmt(p.amount)}</b>
        </div>`).join('')}
        ${d.payments.length>3?`<div style="font-size:12px;color:#94a3b8;text-align:center;padding-top:4px">+ ${d.payments.length-3} دفعات سابقة</div>`:''}
      </div>`:''}
    </div>`;
  };

  el.innerHTML=(pending.length?pending.map(debtCard).join(''):'<div class="empty" style="padding:20px 0">✅ لا توجد ديون معلقة</div>')+
    (done.length?`<div style="font-size:13px;font-weight:700;color:#94a3b8;margin:12px 0 8px;text-align:center">— ديون مسدّدة —</div>${done.map(debtCard).join('')}`:'');
}

  document.getElementById('pay-method').value=id;
}

function savePayment(){
  const amount=+val('pay-amount'), method=val('pay-method'), date=val('pay-date');
  if(!amount||amount<=0) return showToast('⚠️ أدخل مبلغ صحيح','#dc2626');
  if(!method) return showToast('⚠️ اختر طريقة السداد','#dc2626');
  DB.debts=DB.debts.map(d=>{
    if(d.id!==_debtPayId) return d;
    const payments=[...(d.payments||[]),{date,amount,method,note:val('pay-note')}];
    const paid=Math.min(d.total,(d.paid||0)+amount);
    return {...d,paid,payments};
  });
  persist();closeModal();renderDebts();renderHome();
  showToast('✅ تم تسجيل الدفعة','#16a34a');
}

let _debtManId=null;
function openDebtModal(id){
  _debtManId=id||null;
  const d=id?DB.debts.find(x=>x.id===id):null;
  document.getElementById('modal-title').textContent=d?'تعديل الدين':'إضافة دين يدوي';
  document.getElementById('modal-body').innerHTML=`
    ${acField('debt-name','اسم الشخص / الجهة','text',d?.name||'','','customers',true)}
    ${fld('debt-desc','البيان / السبب','text',d?.desc||'','مثال: قرض - سلفة')}
    ${fld('debt-total','إجمالي المبلغ (ج)','number',d?.total||'','',true)}
    ${fld('debt-paid','المدفوع حتى الآن (ج)','number',d?.paid||0)}
    ${fld('debt-date','التاريخ','date',d?.date||today())}
    <div class="modal-actions">
      <button class="btn btn-teal btn-full" onclick="saveDebt()">${d?'حفظ التعديل':'إضافة'}</button>
      <button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button>
    </div>`;
  initAC('debt-name','customers');openModal();
}

function saveDebt(){
  const name=val('debt-name'),total=+val('debt-total');
  if(!name||!total) return showToast('⚠️ الاسم والمبلغ مطلوبين','#dc2626');
  const obj={name,desc:val('debt-desc'),total,paid:+val('debt-paid')||0,date:val('debt-date'),type:'manual',payments:[]};
  if(_debtManId) DB.debts=DB.debts.map(d=>d.id===_debtManId?{...d,...obj}:d);
  else DB.debts.push({id:Date.now(),...obj});
  persist();closeModal();renderDebts();renderHome();
  showToast('✅ تم حفظ الدين','#16a34a');
}

// ===== REPORTS =====
function renderReports(){
  if(currentReportTab==='income') renderIncomeTab();
  else if(currentReportTab==='balance') renderBalanceTab();
  else renderExpensesTab();
}

function renderIncomeTab(){
  const ts=DB.sales.reduce((s,x)=>s+x.total,0);
  const tc=DB.sales.reduce((s,x)=>s+(x.paid||0),0);
  const td=ts-tc;
  const cos=DB.sales.reduce((s,sale)=>s+sale.items.reduce((ss,item)=>{const p=DB.products.find(pr=>pr.id===item.productId);return ss+item.qty*(p?p.buyPrice:0);},0),0);
  const gp=ts-cos;
  const tp=DB.purchases.reduce((s,x)=>s+x.total,0);
  const fixedExp=DB.expenses.filter(e=>e.type==='fixed').reduce((s,e)=>s+e.amount,0);
  const varExp=DB.expenses.filter(e=>e.type!=='fixed').reduce((s,e)=>s+e.amount,0);
  const te=fixedExp+varExp;
  const np=gp-te;
  const row=(label,value,bold,color,indent)=>`<div class="report-row${indent?' indent':''}${bold?' bold':''}"><span>${label}</span><span style="color:${color||'#0f172a'}">${fmt(value||0)}</span></div>`;
  document.getElementById('tab-income').innerHTML=`
    <div class="card">
      <div class="card-header" style="border-color:#2563eb"><span class="card-title">قائمة الدخل</span></div>
      ${row('إجمالي المبيعات',ts,true,'#2563eb')}
      ${row('تكلفة البضاعة المباعة',cos,false,'#dc2626',true)}
      ${row('مجمل الربح',gp,true,gp>=0?'#16a34a':'#dc2626')}
      <div style="height:6px"></div>
      ${row('مصروفات ثابتة',fixedExp,false,'#dc2626',true)}
      ${row('مصروفات متغيرة',varExp,false,'#dc2626',true)}
      ${row('إجمالي المصروفات',te,true,'#dc2626')}
      <div class="net-box" style="background:${np>=0?'#f0fdf4':'#fef2f2'}">
        <span style="font-weight:900;font-size:16px">صافي الربح</span>
        <span style="font-weight:900;font-size:22px;color:${np>=0?'#16a34a':'#dc2626'}">${fmt(np)}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header" style="border-color:#7c3aed"><span class="card-title">ملخص المدفوعات</span></div>
      ${row('المحصّل فعلاً',tc,true,'#16a34a')}
      ${row('ديون العملاء',td,true,'#dc2626')}
      ${row('إجمالي المشتريات',tp,false,'#7c3aed')}
    </div>`;
}

function renderBalanceTab(){

  const inventoryVal=DB.products.reduce((s,p)=>s+p.qty*p.buyPrice,0);
  // Debts owed to us (customer debts)
  const customerDebts=DB.debts.filter(d=>d.type==='customer').reduce((s,d)=>s+(d.total-(d.paid||0)),0);
  const totalAssets=cash+receivables+inventoryVal+customerDebts;
  const payables=DB.purchases.reduce((s,p)=>s+(p.total-(p.paid||0)),0);
  const supplierDebts=DB.debts.filter(d=>d.type==='supplier'||d.type==='manual').reduce((s,d)=>s+(d.total-(d.paid||0)),0);
  const fixedMonthly=DB.expenses.filter(e=>e.type==='fixed').reduce((s,e)=>s+e.amount,0);
  const totalLiab=payables+supplierDebts+fixedMonthly;
  const equity=totalAssets-totalLiab;
  document.getElementById('tab-balance').innerHTML=`
    <div class="card">
      <div class="card-header" style="border-color:#2563eb"><span class="card-title">المركز المالي (الميزانية)</span></div>
      <div style="margin-bottom:6px">

        <div class="bs-row total"><span>إجمالي الأصول</span><span style="color:#2563eb">${fmt(totalAssets)}</span></div>
      </div>
      <div style="height:8px"></div>
      <div style="margin-bottom:6px">
        <div class="bs-section-title">الالتزامات</div>
        <div class="bs-row"><span>ذمم دائنة (موردين)</span><span style="color:#dc2626;font-weight:700">${fmt(payables)}</span></div>
        <div class="bs-row"><span>ديون أخرى</span><span style="color:#dc2626;font-weight:700">${fmt(supplierDebts)}</span></div>
        <div class="bs-row"><span>مصروفات ثابتة شهرية</span><span style="color:#dc2626;font-weight:700">${fmt(fixedMonthly)}</span></div>
        <div class="bs-row total"><span>إجمالي الالتزامات</span><span style="color:#dc2626">${fmt(totalLiab)}</span></div>

      <div style="height:8px"></div>
      <div class="bs-eq">
        <div style="font-size:13px;opacity:.7;margin-bottom:4px">حقوق الملكية = الأصول − الالتزامات</div>
        <div style="font-size:28px;font-weight:900">${fmt(equity)}</div>
      </div>
    </div>`;
}

    </div>
    <div class="card" style="background:#f0fdf4;border:1.5px solid #bbf7d0">

      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>الإيرادات المحصّلة</span><span style="font-weight:800;color:#16a34a">${fmt(totalIncome)}</span></div>

    </div>
    <div class="card">
      <div class="card-header" style="border-color:#64748b">
        <span class="card-title">المصروفات المتغيرة</span>
        <button class="btn btn-sm" style="background:#64748b;color:#fff" onclick="openExpenseModal(null,'variable')">+ إضافة</button>
      </div>
      ${variable.length===0?'<div class="empty" style="padding:16px 0">لا توجد مصروفات متغيرة</div>':''}
      ${variable.map(e=>`<div class="payment-row">
        <div><span style="background:#f0fdf4;color:#166534;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;margin-left:4px">متغير</span><span style="font-weight:600">${e.desc}</span></div>

let _expId=null,_expDefType='variable';
function openExpenseModal(id,defType){
  _expId=id||null;_expDefType=defType||'variable';
  const e=id?DB.expenses.find(x=>x.id===id):null;
  const type=e?.type||_expDefType;
  document.getElementById('modal-title').textContent=e?'تعديل مصروف':'إضافة مصروف';
  document.getElementById('modal-body').innerHTML=`
    ${acField('exp-desc','البيان','text',e?.desc||'','مثال: إيجار - كهرباء','expDescs',true)}
    ${fld('exp-amount','المبلغ (ج)','number',e?.amount||'','',true)}
    ${fld('exp-date','التاريخ','date',e?.date||today())}
    <div class="field"><label>النوع</label>
      <select id="exp-type" style="width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;direction:rtl;background:#f8fafc">
        <option value="fixed" ${type==='fixed'?'selected':''}>ثابت (إيجار، كهرباء...)</option>
        <option value="variable" ${type!=='fixed'?'selected':''}>متغير (طارئ، صيانة...)</option>
      </select></div>
    <div class="modal-actions">
      <button class="btn btn-orange btn-full" onclick="saveExpense()">${e?'حفظ التعديل':'إضافة'}</button>
      <button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button>
    </div>`;
  initAC('exp-desc','expDescs');openModal();
}

function saveExpense(){
  const desc=val('exp-desc'),amount=+val('exp-amount');
  if(!desc||!amount) return showToast('⚠️ البيان والمبلغ مطلوبين','#dc2626');
  const type=val('exp-type')||'variable';
  if(_expId) DB.expenses=DB.expenses.map(e=>e.id===_expId?{...e,desc,amount,date:val('exp-date'),type}:e);
  else DB.expenses.push({id:Date.now(),desc,amount,date:val('exp-date'),type});
  addArchive('expDescs',desc);
  persist();closeModal();renderReports();renderHome();
  showToast('✅ تم حفظ المصروف','#16a34a');
}

  document.getElementById('settings-stats').innerHTML=[

// ===== BACKUP =====
function exportData(){
  const data={...DB,exportedAt:new Date().toISOString(),version:4};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`maintenance-backup-${today()}.json`;a.click();
  URL.revokeObjectURL(url);
  showToast('✅ تم تصدير النسخة الاحتياطية','#16a34a');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(data.products) DB.products=data.products;
      if(data.sales) DB.sales=data.sales;
      if(data.purchases) DB.purchases=data.purchases;
      if(data.expenses) DB.expenses=data.expenses;
      if(data.debts) DB.debts=data.debts;
      if(data.archive) DB.archive={...DB.archive,...data.archive};
      persist();renderScreen(currentScreen);renderHome();
      showToast('✅ تم استيراد البيانات بنجاح','#16a34a');
    }catch{showToast('❌ الملف غير صحيح','#dc2626');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function resetAll(){localStorage.clear();location.reload();}

// ===== GENERIC DELETE =====
function delItem(collection,id,cb){
  DB[collection]=DB[collection].filter(x=>x.id!==id);
  persist();cb();renderHome();
  showToast('🗑️ تم الحذف','#64748b');
}

// ===== MODAL / CONFIRM =====
function openModal(){document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function confirmAction(msg,cb){
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-yes').onclick=()=>{cb();closeConfirm();};
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('open');}

// ===== AUTOCOMPLETE =====
function acField(id,label,type,value,placeholder,archiveKey,required=false){
  return `<div class="field"><label>${label}${required?'<span class="required">*</span>':''}</label>
    <div class="autocomplete-wrap">
      <input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}" autocomplete="off">
      <div id="ac-${id}" class="autocomplete-list" style="display:none"></div>
    </div></div>`;
}

function initAC(id,archiveKey){
  const input=document.getElementById(id);if(!input)return;
  const show=()=>{
    const q=input.value.trim();
    const items=(DB.archive[archiveKey]||[]).filter(i=>!q||i.includes(q)).slice(0,8);
    const list=document.getElementById('ac-'+id);
    if(!items.length){list.style.display='none';return;}
    list.innerHTML=items.map(i=>`<div class="autocomplete-item" onmousedown="selAC('${id}','${i.replace(/'/g,"&#39;")}')">${i}</div>`).join('');
    list.style.display='block';
  };
  input.addEventListener('focus',show);
  input.addEventListener('input',show);
  input.addEventListener('blur',()=>setTimeout(()=>{const l=document.getElementById('ac-'+id);if(l)l.style.display='none';},200));
}

function selAC(id,value){
  document.getElementById(id).value=value;
  const l=document.getElementById('ac-'+id);if(l)l.style.display='none';
}

function fld(id,label,type,value='',placeholder='',required=false){
  return `<div class="field"><label>${label}${required?'<span class="required">*</span>':''}</label><input id="${id}" type="${type}" value="${value}" placeholder="${placeholder}"></div>`;
}

function val(id){return document.getElementById(id)?.value||'';}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n){return (n||0).toLocaleString('ar-EG')+' ج';}

// ===== INIT =====
renderHome();
</script>

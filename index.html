<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مركز الصيانة</title>
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#f1f5f9;font-family:'Cairo',Tahoma,sans-serif;direction:rtl}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#f1f5f9}
#header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#header.hidden{display:none}
#back-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:18px;font-family:inherit}
#header-title{font-weight:900;font-size:16px;flex:1}
#content{flex:1;overflow-y:auto;padding:14px 12px 88px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.08)}
.nav-btn{flex:1;padding:10px 2px 8px;border:none;background:transparent;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-icon{font-size:17px}.nav-label{font-size:9px;font-weight:500;color:#94a3b8}
.nav-btn.active .nav-label{font-weight:800;color:#2563eb}
.nav-dot{width:16px;height:2px;background:#2563eb;border-radius:2px;margin-top:1px;display:none}
.nav-btn.active .nav-dot{display:block}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:20px;padding:18px 16px;margin-bottom:14px;color:#fff;text-align:center}
.stats-row{display:flex;gap:8px;margin-bottom:8px}
.stat-card{flex:1;border-radius:14px;padding:13px 12px;color:#fff;cursor:pointer;min-width:0}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:2px solid #e2e8f0;padding-bottom:8px}
.card-title{font-weight:900;font-size:15px;color:#0f172a}
.screen-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.screen-title{font-size:19px;font-weight:900;margin:0}
.search-input{width:100%;padding:10px 13px;border:2px solid #e2e8f0;border-radius:11px;font-size:14px;margin-bottom:11px;font-family:inherit;direction:rtl;background:#f8fafc;outline:none}
.search-input:focus{border-color:#3b82f6}
.item-name{font-weight:800;font-size:15px;color:#0f172a}
.item-sub{font-size:13px;color:#64748b;margin-top:3px}
.badge{border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700}
.empty{text-align:center;color:#94a3b8;padding:36px 0;font-size:14px}
.btn{border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.8}.btn:disabled{background:#e2e8f0!important;color:#94a3b8!important;cursor:not-allowed}
.btn-primary{background:#2563eb;color:#fff;padding:12px 20px}
.btn-green{background:#16a34a;color:#fff;padding:12px 20px}
.btn-purple{background:#7c3aed;color:#fff;padding:12px 20px}
.btn-orange{background:#ea580c;color:#fff;padding:12px 20px}
.btn-red{background:#dc2626;color:#fff;padding:12px 20px}
.btn-teal{background:#0d9488;color:#fff;padding:12px 20px}
.btn-outline{background:transparent;color:#64748b;border:2px solid #64748b;padding:10px 18px}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-full{width:100%}
.btn-add{background:#2563eb;color:#fff;padding:8px 14px;font-size:12px;border-radius:11px;border:none;font-family:inherit;font-weight:700;cursor:pointer}
.btn-ic{border:none;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:2px solid #e2e8f0;border-radius:11px;font-size:14px;font-family:inherit;direction:rtl;background:#f8fafc;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3b82f6}
.required{color:#ef4444;margin-right:3px}
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;right:0;left:0;background:#fff;border:2px solid #3b82f6;border-top:none;border-radius:0 0 11px 11px;z-index:500;max-height:160px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.autocomplete-item{padding:9px 13px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-family:inherit}
.autocomplete-item:active{background:#dbeafe}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:20px 16px 30px;direction:rtl}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:800;color:#0f172a}
.modal-close{background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}
.modal-actions{display:flex;gap:8px;margin-top:8px}
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:24px}
#confirm-overlay.open{display:flex}
#confirm-box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:300px;direction:rtl;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#confirm-msg{font-size:15px;font-weight:600;color:#0f172a;margin:10px 0 18px}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 22px;border-radius:13px;font-size:13px;font-weight:700;z-index:3000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:300px;text-align:center}
.tabs{display:flex;gap:5px;margin-bottom:12px;background:#e2e8f0;border-radius:11px;padding:3px}
.tab{flex:1;padding:7px;border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#64748b}
.tab.active{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.report-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9}
.report-row.indent{padding-right:12px}
.report-row span:first-child{font-size:13px;color:#374151}
.report-row span:last-child{font-size:13px;font-weight:600}
.report-row.bold span{font-weight:900}
.net-box{border-radius:11px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.items-list{background:#f8fafc;border-radius:11px;padding:9px 11px;margin-bottom:12px}
.items-list-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid #e2e8f0}
.total-row{display:flex;justify-content:space-between;font-weight:900;margin-top:9px;font-size:15px;color:#0f172a}
.total-hl{background:#f0fdf4;border-radius:11px;padding:11px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.settings-btn{background:#dbeafe;border:none;border-radius:11px;padding:12px 14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#1e40af;display:flex;align-items:center;gap:10px;width:100%;margin-bottom:9px}
.settings-btn.danger{background:#fee2e2;color:#dc2626}
.settings-btn.success{background:#dcfce7;color:#166534}
.bs-row{display:flex;justify-content:space-between;padding:8px 11px;font-size:13px;border-bottom:1px solid #f8fafc}
.bs-row.total{background:#f1f5f9;font-weight:900;border-radius:8px;margin-top:4px;padding:9px 11px}
.bs-eq{text-align:center;padding:12px;background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:11px;color:#fff;margin:8px 0}
.debt-card{background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px;border-right:4px solid #dc2626}
.debt-card.supplier{border-right-color:#7c3aed}
.debt-card.paid{border-right-color:#16a34a;opacity:.7}
.payment-method-btn{flex:1;padding:9px 6px;border:2px solid #e2e8f0;border-radius:11px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:#f8fafc;color:#374151;text-align:center}
.payment-method-btn.active{border-color:#2563eb;background:#dbeafe;color:#1e40af}
.payment-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.date-filter{display:flex;gap:5px;margin-bottom:11px}
.df-btn{flex:1;padding:8px 4px;border:2px solid #e2e8f0;border-radius:9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#64748b;text-align:center}
.df-btn.active{border-color:#2563eb;background:#dbeafe;color:#1e40af}
.period-stat{flex:1;background:#fff;border-radius:12px;padding:12px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.period-stat-val{font-size:15px;font-weight:900;margin-top:3px}
.period-stat-label{font-size:10px;color:#64748b;margin-top:2px}
.perm-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.perm-label{font-size:13px;font-weight:700;color:#374151}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:24px;transition:.3s}
.slider:before{content:'';position:absolute;height:18px;width:18px;right:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:#2563eb}
input:checked+.slider:before{transform:translateX(-20px)}
.counter-black{background:#0f172a;color:#fff;border:2px solid #1e293b;border-radius:11px;padding:10px 13px;font-size:16px;font-family:inherit;font-weight:900;text-align:center;width:100%;outline:none}
.prod-search-results{max-height:200px;overflow-y:auto;border:2px solid #e2e8f0;border-radius:11px;background:#fff;margin-bottom:10px}
.prod-result-item{padding:10px 13px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.prod-result-item:active{background:#dbeafe}
.quick-action-btn{flex:1;border:none;border-radius:16px;padding:20px 12px;cursor:pointer;text-align:center;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px}
.quick-action-btn:active{transform:scale(.96)}
.task-card{background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px}
/* Customer ledger */
.ledger-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.ledger-credit{color:#16a34a;font-weight:700}
.ledger-debit{color:#dc2626;font-weight:700}
/* Global search */
#global-search-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#global-search-input{flex:1;padding:10px 13px;border:2px solid #3b82f6;border-radius:11px;font-size:14px;font-family:inherit;direction:rtl;background:#fff;outline:none}
.search-result-tag{font-size:10px;background:#dbeafe;color:#1e40af;border-radius:6px;padding:2px 7px;margin-right:4px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="header" class="hidden">
    <button id="back-btn" onclick="navigateBack()">←</button>
    <div id="header-title"></div>
    <button style="background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px" onclick="openGlobalSearch()">🔍</button>
    <div id="sync-status" style="font-size:10px;color:rgba(255,255,255,.6);min-width:50px;text-align:left">☁️</div>
  </div>
  <div id="content">

    <div id="screen-home" class="screen active">
      <div class="hero">
        <div style="font-size:22px;font-weight:900;margin-bottom:4px">🖨️ مركز الصيانة</div>
        <div id="today-date" style="font-size:13px;opacity:.7"></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="quick-action-btn" style="background:#dbeafe;color:#1e40af" onclick="openSaleModal()"><span style="font-size:22px">🧾</span><span style="font-size:10px;font-weight:800">فاتورة</span></button>
        <button class="quick-action-btn" style="background:#fdf2f8;color:#86198f" onclick="openMovementModal()"><span style="font-size:22px">🔧</span><span style="font-size:10px;font-weight:800">تحرك</span></button>
        <button class="quick-action-btn" style="background:#dcfce7;color:#166534" onclick="openTaskModal()"><span style="font-size:22px">📋</span><span style="font-size:10px;font-weight:800">مهمة</span></button>
        <button class="quick-action-btn" style="background:#fff7ed;color:#c2410c" onclick="openExpenseModal()"><span style="font-size:22px">💸</span><span style="font-size:10px;font-weight:800">مصروف</span></button>
        <button class="quick-action-btn" style="background:#f5f3ff;color:#6d28d9" onclick="openGlobalSearch()"><span style="font-size:22px">🔍</span><span style="font-size:10px;font-weight:800">بحث</span></button>
      </div>
      <div id="tasks-home-widget"></div>
      <div class="stats-row">
        <div class="stat-card" style="background:#2563eb;cursor:pointer" onclick="navigate('reports')">
          <div style="font-size:11px;opacity:.8;margin-bottom:4px">💰 إجمالي المبيعات</div>
          <div id="stat-sales" style="font-size:18px;font-weight:900">0 ج</div>
        </div>
        <div id="stat-profit-card" class="stat-card" style="background:#16a34a;cursor:pointer" onclick="navigate('reports')">
          <div style="font-size:11px;opacity:.8;margin-bottom:4px"><span id="stat-profit-icon">📈</span> صافي الربح</div>
          <div id="stat-profit" style="font-size:18px;font-weight:900">0 ج</div>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <div class="stat-card" style="background:#dc2626;cursor:pointer" onclick="navigate('debts')">
          <div style="font-size:11px;opacity:.8;margin-bottom:4px">💳 الديون المتبقية</div>
          <div id="stat-debts" style="font-size:16px;font-weight:900">0 ج</div>
        </div>
      </div>
      <div id="low-stock-alert"></div>
      <div style="text-align:center;padding:10px 0;color:#94a3b8;font-size:11px">v9.0 ☁️ Supabase</div>
    </div>

    <div id="screen-inventory" class="screen">
      <div class="screen-header"><div class="screen-title">📦 المخزون</div><div style="display:flex;gap:6px"><button class="btn-add" style="background:#7c3aed" onclick="switchInvTab('stats')">📊</button><button class="btn-add" onclick="openProductModal()">+ منتج</button></div></div>
      <div id="inv-main"><input type="text" class="search-input" placeholder="🔍 بحث..." id="inv-search" oninput="renderInventory()"><div id="inventory-list"></div></div>
      <div id="inv-stats" style="display:none"><div id="inv-stats-body"></div></div>
    </div>

    <div id="screen-sales" class="screen">
      <div class="screen-header"><div class="screen-title">🧾 المبيعات</div><div style="display:flex;gap:6px"><button id="sales-ms-btn" class="btn-add" style="background:#64748b" onclick="startMultiSelect('sales')">☑️ تحديد</button><button class="btn-add" onclick="openSaleModal()">+ فاتورة</button></div></div>
      <div id="ms-toolbar" style="display:none;align-items:center;gap:8px;background:#f1f5f9;border-radius:11px;padding:10px 12px;margin-bottom:10px"></div>
      <input type="text" class="search-input" placeholder="🔍 بحث بالاسم أو السيريال..." id="sales-search" oninput="_salesPage=0;renderSales()">
      <div id="sales-list"></div>
    </div>

    <div id="screen-movements" class="screen">
      <div class="screen-header">
        <div class="screen-title">🔧 التحركات</div>
        <div style="display:flex;gap:6px">
          <button class="btn-add" style="background:#86198f" onclick="openMovementModal()">+ تحرك</button>
          <button class="btn-add" style="background:#ea580c" onclick="navigate('movements-report')">📊</button>
        </div>
      </div>
      <div class="tabs" style="margin-bottom:10px">
        <button class="tab active" onclick="switchMovTab('list',this)">الأعطال</button>
        <button class="tab" onclick="switchMovTab('sched',this)">📅 الأسبوع</button>
        <button class="tab" onclick="switchMovTab('archive',this)">🗃️ أرشيف</button>
      </div>
      <div id="movements-list"></div>
      <div id="schedule-body" style="display:none"></div>
      <div id="movements-archive-body" style="display:none"></div>
    </div>

    <div id="screen-movements-report" class="screen"><div id="movements-report-body"></div></div>

    <div id="screen-purchases" class="screen">
      <div class="screen-header"><div class="screen-title">🛒 المشتريات</div><button class="btn-add" onclick="openPurchaseModal()">+ مشترى</button></div>
      <input type="text" class="search-input" placeholder="🔍 بحث..." id="purch-search" oninput="renderPurchases()">
      <div id="purchases-list"></div>
    </div>

    <div id="screen-debts" class="screen">
      <div class="screen-header">
        <div class="screen-title">💳 الديون</div>
        <div style="display:flex;gap:5px">
          <button class="btn-add" style="background:#2563eb" onclick="openDebtModal('customer')">+ عليه</button>
          <button class="btn-add" style="background:#dc2626" onclick="openDebtModal('supplier')">+ علي</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchDebtTab('customer',this)">💰 لي عليهم</button>
        <button class="tab" onclick="switchDebtTab('supplier',this)">💸 علي أنا</button>
        <button class="tab" onclick="switchDebtTab('all',this)">الكل</button>
      </div>
      <div id="debts-list"></div>
    </div>

    <div id="screen-tasks" class="screen">
      <div class="screen-header">
        <div class="screen-title">📋 المهمات</div>
        <div style="display:flex;gap:6px">
          <button class="btn-add" onclick="openTaskModal()">+ مهمة</button>
          <button class="btn-add" style="background:#ea580c" onclick="navigate('tasks-report')">📊</button>
        </div>
      </div>
      <div id="tasks-list"></div>
    </div>

    <div id="screen-tasks-report" class="screen"><div id="tasks-report-body"></div></div>

    <div id="screen-reports" class="screen">
      <div style="font-size:19px;font-weight:900;margin-bottom:12px">📊 التقارير المالية</div>
      <div class="date-filter" style="margin-bottom:10px">
        <button class="df-btn active" onclick="setDateFilter(new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0],today(),this)">هذا الشهر</button>
        <button class="df-btn" onclick="setDateFilter(new Date(new Date().getFullYear(),0,1).toISOString().split('T')[0],today(),this)">هذا العام</button>
        <button class="df-btn" onclick="setDateFilter('',today(),this)">الكل</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchReportTab('period',this)">قائمة الدخل</button>
        <button class="tab" onclick="switchReportTab('income',this)">التحصيل</button>
        <button class="tab" onclick="switchReportTab('balance',this)">المركز</button>
        <button class="tab" onclick="switchReportTab('expenses',this)">المصروفات</button>
        <button class="tab" onclick="switchReportTab('analysis',this)">📈 تحليل</button>
      </div>
      <div id="tab-period"></div>
      <div id="tab-income" style="display:none"></div>
      <div id="tab-balance" style="display:none"></div>
      <div id="tab-expenses" style="display:none"></div>
      <div id="tab-analysis" style="display:none"></div>
    </div>

    <div id="screen-settings" class="screen">
      <div style="font-size:19px;font-weight:900;margin-bottom:12px">⚙️ الإعدادات</div>
      <div id="settings-body"></div>
    </div>

    <div id="screen-more" class="screen">
      <div style="font-size:19px;font-weight:900;margin-bottom:16px">☰ المزيد</div>
      <div id="more-body"></div>
    </div>

    <div id="screen-expenses" class="screen">
      <div class="screen-header">
        <div class="screen-title">💸 المصاريف</div>
        <button class="btn-add" onclick="openExpenseModal()">+ مصروف</button>
      </div>
      <div id="expenses-list"></div>
    </div>

    <div id="screen-ledger" class="screen"></div>

    <div id="screen-accounting" class="screen">
      <div style="font-size:19px;font-weight:900;margin-bottom:12px">📒 الحسابات</div>

// ===== SUPABASE FETCH =====
async function supaFetch(table, method, body, query){
  var url = SUPA_URL + '/rest/v1/' + table + (query||'');
  var opts = { method: method||'GET', headers: Object.assign({},HEADERS) };
  if(body) opts.body = JSON.stringify(body);
  if(method==='GET') delete opts.headers['Prefer'];
  if(method==='DELETE') opts.headers['Prefer'] = 'return=minimal';
  var res = await fetch(url, opts);
  if(!res.ok){ var err = await res.text(); throw new Error(table+' '+method+': '+err); }
  var text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadDB(){

      supaFetch('movements','GET',null,'?order=created_at.desc'),

    DB.archive    = settings.archive    || {customers:[],suppliers:[],products:[],expDescs:[],serials:[],models:[]};
    DB.accounts   = settings.accounts   || {capital:[],fixed_assets:[],fixed_expenses:[],receivables:[]};

// ===== UPSERT / UPDATE / DELETE =====
async function dbUpsert(table, row){
  try{
    var r = normalizeForDB(table, row);

    setSyncStatus('☁️ محفوظ','#16a34a');

  }catch(e){

    setSyncStatus('❌','#dc2626');

// تحويل أسماء الحقول للتوافق مع Supabase
function normalizeForDB(table, obj){
  if(!obj) return obj;
  var r = Object.assign({}, obj);

  // JSONB fields must be objects/arrays not strings
  // Supabase handles JS objects directly for jsonb columns

  // tasks: desc -> details
  if(table==='tasks'){
    if(r.desc !== undefined){ r.details = r.desc; }
    delete r.desc;
  }
  // debts: desc -> details
  if(table==='debts'){
    if(r.desc !== undefined){ r.details = r.desc; }
    delete r.desc;
  }
  // expenses: desc -> label
  if(table==='expenses'){
    if(r.desc !== undefined){ r.label = r.desc; }
    delete r.desc;
  }
  // sales: make sure items/services are arrays not undefined
  if(table==='sales'){
    if(!r.items) r.items = [];
    if(!r.services) r.services = [];
    if(!r.payments) r.payments = [];
  }
  // debts: make sure payments is array
  if(table==='debts'){
    if(!r.payments) r.payments = [];
  }
  // movements: make sure parts/log are arrays
  if(table==='movements'){
    if(!r.parts) r.parts = [];
    if(!r.log) r.log = [];
  }
  return r;
}

// تحويل البيانات من Supabase للتطبيق
function normalizeFromDB(table, items){
  if(!items) return [];
  return items.map(function(obj){
    var r = Object.assign({}, obj);
    if(table==='tasks'){ r.desc = r.details || r.desc || ''; }
    if(table==='debts'){ r.desc = r.details || r.desc || ''; }
    if(table==='expenses'){ r.desc = r.label || r.desc || ''; }
    return r;
  });
}

function initAC(id,archiveKey){
  var input=document.getElementById(id);if(!input)return;
  function show(){
    var q=input.value.trim();
    var items=(DB.archive[archiveKey]||[]).filter(function(i){return!q||normalizeAr(i).includes(normalizeAr(q));}).slice(0,8);
    var list=document.getElementById('ac-'+id);

    list.style.display='block';

  input.addEventListener('focus',show);

function navigate(screen){
  if(screen!==currentScreen){_navHistory.push(screen);if(_navHistory.length>20)_navHistory.shift();}
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var scEl=document.getElementById('screen-'+screen);
  if(!scEl){console.warn('Screen not found:',screen);return;}
  scEl.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.screen===screen);});
  var hdr=document.getElementById('header');
  if(screen==='home')hdr.classList.add('hidden');
  else{hdr.classList.remove('hidden');document.getElementById('header-title').textContent=(navIcons[screen]||'')+' '+(navLabels[screen]||screen);}
  currentScreen=screen;
  renderScreen(screen);
  document.getElementById('content').scrollTop=0;
}

function navigateBack(){
  // مش بيخرج من التطبيق أبداً
  if(_navHistory.length>1){
    _navHistory.pop();
    var prev=_navHistory[_navHistory.length-1]||'home';
    // إزالة السكرين الحالي من الـ history قبل الانتقال
    var scEl=document.getElementById('screen-'+prev);
    if(!scEl)prev='home';
    // انتقال مباشر بدون إضافة للـ history
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    document.getElementById('screen-'+prev).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.screen===prev);});
    var hdr=document.getElementById('header');
    if(prev==='home')hdr.classList.add('hidden');
    else{hdr.classList.remove('hidden');document.getElementById('header-title').textContent=(navIcons[prev]||'')+' '+(navLabels[prev]||prev);}
    currentScreen=prev;
    renderScreen(prev);
    document.getElementById('content').scrollTop=0;
  } else {
    // دائماً الهوم كحد أدنى
    navigate('home');
  }
}

  });
  DB.debts.forEach(function(d){

      results.push({icon:'🔧',label:'تحرك',title:esc(m.customer),sub:esc(m.faultType)+' — '+esc(m.status),action:'navigate(\'movements\')'});

  DB.tasks.forEach(function(t){

    '<div class="modal-actions"><button class="btn btn-green btn-full" onclick="saveProduct()">'+(p?'حفظ التعديل':'إضافة')+'</button><button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button></div>';
  initAC('prod-name','products');

function selectProdType(type){
  document.getElementById('prod-unit').value=type;
  ['جديد','استعمال خارجي','استعمال داخلي'].forEach(function(t){
    var btn=document.getElementById('ptype-'+t.replace(/ /g,'-'));
    if(!btn)return;
    var active=t===type;
    btn.style.borderColor=active?'#2563eb':'#e2e8f0';
    btn.style.background=active?'#dbeafe':'#fff';
    btn.style.color=active?'#1e40af':'#64748b';
  });
}

async function saveProduct(){
  var name=v('prod-name'),qty=+v('prod-qty');
  if(!name)return showToast('⚠️ اسم المنتج مطلوب','#dc2626');
  if(isNaN(qty)||qty<0)return showToast('⚠️ الكمية غير صحيحة','#dc2626');
  var obj={name:name,unit:v('prod-unit')||'جديد',qty:qty,min_qty:+v('prod-minqty')||0,buy_price:+v('prod-buy')||0,sell_price:+v('prod-sell')||0};
  if(_prodId){
    DB.products=DB.products.map(function(p){return p.id===_prodId?Object.assign({},p,obj):p;});
    await dbUpdate('products',_prodId,obj);
  }else{
    obj.id=genId();
    DB.products.push(obj);
    await dbUpsert('products',obj);
  }
  addArchive('products',name);
  closeModal();renderInventory();renderHome();
  showToast(_prodId?'✅ تم تعديل المنتج':'✅ تم إضافة المنتج','#16a34a');
}

function filterProds(){
  var q=v('prod-search');
  var res=document.getElementById('prod-results');if(!res)return;
  var list=DB.products.filter(function(p){return!q||normalizeAr(p.name).includes(normalizeAr(q));}).slice(0,8);

  res.innerHTML=list.map(function(p){
    return '<div class="prod-result-item" onmousedown="addProdToSale(\''+p.id+'\')">'+
      '<div><div style="font-weight:700;font-size:14px">'+esc(p.name)+'</div>'+

      '<div style="background:#2563eb;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700">+ إضافة</div></div>';

function addProdToSale(pid){
  var p=DB.products.find(function(x){return x.id===pid;});if(!p)return;
  var ex=_saleItems.find(function(i){return i.productId===pid;});
  if(ex)ex.qty++;else _saleItems.push({productId:p.id,name:p.name,qty:1,price:p.sell_price,buyPrice:p.buy_price});
  var sc=v('sale-customer'),sp=v('sale-paid'),sn=v('sale-note'),sk=v('sale-counter'),slc=v('sale-color-counter'),ss=v('sale-serial'),sm=v('sale-model');
  var s=_saleId?DB.sales.find(function(x){return x.id===_saleId;}):null;
  renderSaleBody(s);
  if(document.getElementById('sale-customer'))document.getElementById('sale-customer').value=sc;
  if(document.getElementById('sale-paid'))document.getElementById('sale-paid').value=sp;
  if(document.getElementById('sale-note'))document.getElementById('sale-note').value=sn;
  if(document.getElementById('sale-counter'))document.getElementById('sale-counter').value=sk;
  if(document.getElementById('sale-color-counter'))document.getElementById('sale-color-counter').value=slc;
  if(document.getElementById('sale-serial'))document.getElementById('sale-serial').value=ss;
  if(document.getElementById('sale-model'))document.getElementById('sale-model').value=sm;
}

function chgQty(idx,delta){
  _saleItems[idx].qty=Math.max(1,_saleItems[idx].qty+delta);
  var sc=v('sale-customer'),sp=v('sale-paid'),sn=v('sale-note'),sk=v('sale-counter'),slc=v('sale-color-counter'),ss=v('sale-serial'),sm=v('sale-model');
  var s=_saleId?DB.sales.find(function(x){return x.id===_saleId;}):null;
  renderSaleBody(s);
  if(document.getElementById('sale-customer'))document.getElementById('sale-customer').value=sc;
  if(document.getElementById('sale-paid'))document.getElementById('sale-paid').value=sp;
  if(document.getElementById('sale-serial'))document.getElementById('sale-serial').value=ss;
  if(document.getElementById('sale-model'))document.getElementById('sale-model').value=sm;
}

function rmSaleItem(idx){_saleItems.splice(idx,1);var s=_saleId?DB.sales.find(function(x){return x.id===_saleId;}):null;renderSaleBody(s);}
function rmSaleService(idx){_saleServices.splice(idx,1);var s=_saleId?DB.sales.find(function(x){return x.id===_saleId;}):null;renderSaleBody(s);}

function updateSaleDiscount(){
  // لو كتب مبلغ خصم — احسب النسبة
  var disc=+v('sale-discount')||0;
  var sub=_saleItems.reduce(function(t,i){return t+i.qty*i.price;},0)+_saleServices.reduce(function(t,sv){return t+sv.price;},0);
  if(sub>0&&document.getElementById('sale-discount-pct')){
    document.getElementById('sale-discount-pct').value=disc?Math.round(disc/sub*100):'';
  }
}
function updateSaleDiscountPct(){
  // لو كتب نسبة — احسب المبلغ
  var pct=+v('sale-discount-pct')||0;
  var sub=_saleItems.reduce(function(t,i){return t+i.qty*i.price;},0)+_saleServices.reduce(function(t,sv){return t+sv.price;},0);
  if(document.getElementById('sale-discount'))
    document.getElementById('sale-discount').value=pct?Math.round(sub*pct/100):'';
}

async function saveSale(){
  var customer=v('sale-customer');
  if(!customer)return showToast('⚠️ اسم العميل مطلوب','#dc2626');
  var subtotal=_saleItems.reduce(function(t,i){return t+i.qty*i.price;},0)+
            _saleServices.reduce(function(t,sv){return t+sv.price;},0);
  var _discount=+v('sale-discount')||0;
  var total=Math.max(0,subtotal-_discount);
  var paid=+v('sale-paid')||0;
  if(!_saleItems.length&&!_saleServices.length&&!paid)return showToast('⚠️ أضف منتجات أو خدمة','#dc2626');
  if(!_saleItems.length&&!_saleServices.length&&paid)total=paid;
  var status=paid>=total?'مدفوع':paid>0?'جزئي':'غير مدفوع';

  async function doSave(img){
    var discount=+v('sale-discount')||0;
    var obj={customer:customer,date:v('sale-date'),items:_saleItems.slice(),services:_saleServices.slice(),
      total:total,paid:paid,status:status,counter:v('sale-counter'),color_counter:v('sale-color-counter'),
      note:v('sale-note'),serial:v('sale-serial'),model:v('sale-model'),image:img||'',discount:discount};
    if(_saleId){
      DB.sales=DB.sales.map(function(s){return s.id===_saleId?Object.assign({},s,obj):s;});
      await dbUpdate('sales',_saleId,obj);
    }else{
      // stock check
      var stockErrors=[];
      _saleItems.forEach(function(item){
        var prod=DB.products.find(function(p){return p.id===item.productId;});
        if(prod&&prod.qty<item.qty)stockErrors.push(esc(item.name)+': متوفر '+prod.qty);
      });
      if(stockErrors.length)return showToast('⚠️ '+stockErrors[0],'#dc2626');
      obj.id=genId();
      DB.sales.unshift(obj);
      await dbUpsert('sales',obj);
      // update stock
      for(var i=0;i<_saleItems.length;i++){
        var item=_saleItems[i];
        var prod=DB.products.find(function(p){return p.id===item.productId;});
        if(prod){
          var newQty=Math.max(0,prod.qty-item.qty);
          DB.products=DB.products.map(function(p){return p.id===item.productId?Object.assign({},p,{qty:newQty}):p;});
          await dbUpdate('products',item.productId,{qty:newQty});
        }
      }
      if(paid<total){
        var debt={id:genId(),type:'customer',name:customer,desc:'فاتورة'+(v('sale-serial')?' — '+v('sale-serial'):''),total:total-paid,paid:0,date:v('sale-date'),payments:[]};
        DB.debts.unshift(debt);
        await dbUpsert('debts',debt);
      }
    }
    addArchive('customers',customer);
    if(v('sale-serial'))addArchive('serials',v('sale-serial'));
    if(v('sale-model'))addArchive('models',v('sale-model'));
    await persist();
    closeModal();renderSales();renderHome();
    showToast(_saleId?'✅ تم تعديل الفاتورة':'✅ تم حفظ الفاتورة','#16a34a');
  }

  var imgInput=document.getElementById('sale-image');
  if(imgInput&&imgInput.files&&imgInput.files[0]){
    var fileSizeKB=imgInput.files[0].size/1024;
    if(fileSizeKB>200)return showToast('⚠️ الصورة كبيرة — الحد 200KB','#dc2626');
    var r=new FileReader();r.onload=function(e){doSave(e.target.result);};r.readAsDataURL(imgInput.files[0]);
  }else doSave('');
}

function openPurchaseModal(id){
  _purchId=id||null;
  var p=id?DB.purchases.find(function(x){return x.id===id;}):null;
  _purchItems=p?(p.items||[]).slice():[];
  document.getElementById('modal-title').textContent=p?'تعديل المشترى':'مشترى جديد';
  renderPurchBody(p);openModal();
}

function renderPurchBody(p){
  var total=_purchItems.reduce(function(s,i){return s+i.qty*i.price;},0);
  var itemsHtml='';
  if(_purchItems.length){
    itemsHtml='<div class="items-list">'+
      _purchItems.map(function(it,i){
        return '<div class="items-list-row"><span style="flex:1;font-size:13px">'+esc(it.name)+'</span>'+
          '<div style="display:flex;align-items:center;gap:5px">'+
          '<button onclick="chgPurchQty('+i+',-1)" style="background:#fee2e2;border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;font-weight:900;color:#dc2626">−</button>'+
          '<span style="font-weight:900;font-size:14px;min-width:22px;text-align:center">'+it.qty+'</span>'+
          '<button onclick="chgPurchQty('+i+',1)" style="background:#dcfce7;border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;font-weight:900;color:#16a34a">+</button>'+
          '<input type="number" id="pi-price-'+i+'" value="'+it.price+'" style="width:65px;padding:4px 6px;border:2px solid #e2e8f0;border-radius:7px;font-size:13px;font-family:inherit;text-align:center" oninput="updPurchPrice('+i+',this.value)">'+
          '<button onclick="rmPurchItem('+i+')" style="background:#fee2e2;border:none;border-radius:6px;padding:2px 6px;cursor:pointer;font-size:11px;color:#dc2626">✕</button>'+
          '</div></div>';
      }).join('')+
      '<div class="total-row"><span>الإجمالي</span><span style="color:#7c3aed">'+fmt(total)+'</span></div></div>';
  }
  document.getElementById('modal-body').innerHTML=
    acField('purch-supplier','المورد','text',p?p.supplier:'','','suppliers',true)+
    '<div class="field"><label>إضافة منتج</label>'+
    '<input id="purch-prod-search" type="text" placeholder="اكتب اسم المنتج..." oninput="filterPurchProds()" autocomplete="off" style="width:100%;padding:10px 13px;border:2px solid #3b82f6;border-radius:11px;font-size:14px;font-family:inherit;direction:rtl;background:#f8fafc;outline:none;margin-bottom:6px">'+
    '<div id="purch-prod-results" style="display:none" class="prod-search-results"></div></div>'+
    itemsHtml+
    fld('purch-paid','المبلغ المدفوع (ج)','number',p?p.paid:'')+
    dateField('purch-date','📅 التاريخ',p?p.date:null)+
    '<div class="modal-actions"><button class="btn btn-purple btn-full" onclick="savePurchase()">'+(p?'حفظ':'حفظ المشترى')+'</button><button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button></div>';
  initAC('purch-supplier','suppliers');
}

function filterPurchProds(){
  var q=v('purch-prod-search');
  var res=document.getElementById('purch-prod-results');if(!res)return;
  var list=DB.products.filter(function(p){return!q||normalizeAr(p.name).includes(normalizeAr(q));}).slice(0,8);
  if(!list.length){res.style.display='none';return;}
  res.innerHTML=list.map(function(p){
    return '<div class="prod-result-item" onmousedown="addProdToPurch(\''+p.id+'\')">'+
      '<div><div style="font-weight:700;font-size:14px">'+esc(p.name)+'</div>'+
      '<div style="font-size:12px;color:#94a3b8">شراء: '+p.buy_price+' ج</div></div>'+
      '<div style="background:#7c3aed;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700">+ إضافة</div></div>';
  }).join('');
  res.style.display='block';
}

function addProdToPurch(pid){
  var p=DB.products.find(function(x){return x.id===pid;});if(!p)return;
  var ex=_purchItems.find(function(i){return i.productId===pid;});
  if(ex)ex.qty++;else _purchItems.push({productId:p.id,name:p.name,qty:1,price:p.buy_price});
  var ss=v('purch-supplier'),sp=v('purch-paid');
  var pur=_purchId?DB.purchases.find(function(x){return x.id===_purchId;}):null;
  renderPurchBody(pur);
  if(document.getElementById('purch-supplier'))document.getElementById('purch-supplier').value=ss;
  if(document.getElementById('purch-paid'))document.getElementById('purch-paid').value=sp;
}

function chgPurchQty(idx,delta){
  _purchItems[idx].qty=Math.max(1,_purchItems[idx].qty+delta);
  var ss=v('purch-supplier'),sp=v('purch-paid');
  var pur=_purchId?DB.purchases.find(function(x){return x.id===_purchId;}):null;
  renderPurchBody(pur);
  if(document.getElementById('purch-supplier'))document.getElementById('purch-supplier').value=ss;
  if(document.getElementById('purch-paid'))document.getElementById('purch-paid').value=sp;
}

function rmPurchItem(idx){_purchItems.splice(idx,1);var pur=_purchId?DB.purchases.find(function(x){return x.id===_purchId;}):null;renderPurchBody(pur);}
function updPurchPrice(idx,val){_purchItems[idx].price=+val||0;}

async function savePurchase(){
  var supplier=v('purch-supplier');
  if(!supplier)return showToast('⚠️ اسم المورد مطلوب','#dc2626');
  if(!_purchItems.length)return showToast('⚠️ أضف منتجاً واحداً على الأقل','#dc2626');
  var total=_purchItems.reduce(function(s,i){return s+i.qty*i.price;},0);
  var paid=+v('purch-paid')||0;
  var obj={supplier:supplier,date:v('purch-date'),items:_purchItems.slice(),total:total,paid:paid};
  if(_purchId){
    DB.purchases=DB.purchases.map(function(p){return p.id===_purchId?Object.assign({},p,obj):p;});
    await dbUpdate('purchases',_purchId,obj);
  }else{
    obj.id=genId();
    DB.purchases.unshift(obj);
    await dbUpsert('purchases',obj);
    for(var i=0;i<_purchItems.length;i++){
      var item=_purchItems[i];
      var prod=DB.products.find(function(p){return p.id===item.productId;});
      if(prod){
        var newQty=prod.qty+item.qty;
        DB.products=DB.products.map(function(p){return p.id===item.productId?Object.assign({},p,{qty:newQty,buy_price:item.price}):p;});
        await dbUpdate('products',item.productId,{qty:newQty,buy_price:item.price});
      }
    }
    if(paid<total){
      var debt={id:genId(),type:'supplier',name:supplier,desc:'مشترى',total:total-paid,paid:0,date:v('purch-date'),payments:[]};
      DB.debts.unshift(debt);
      await dbUpsert('debts',debt);
    }
  }
  addArchive('suppliers',supplier);
  await persist();
  closeModal();renderPurchases();renderHome();
  showToast(_purchId?'✅ تم التعديل':'✅ تم حفظ المشترى','#16a34a');
}

  var suppOwed=DB.debts.filter(function(d){return d.type==='supplier';}).reduce(function(s,d){return s+(d.total-(d.paid||0));},0);

      ?'<span style="background:#fef2f2;color:#dc2626;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800">💸 أنا مدين</span>'
      :'<span style="background:#dcfce7;color:#15803d;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800">💰 العميل مدين</span>';

      '<div style="flex:1"><div style="font-weight:900;font-size:15px">'+esc(d.name)+'</div>'+

      (isPaid?'<span style="background:#dcfce7;color:#15803d;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800">✅ منتهي</span>':'')+

      '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:900;border-top:1px solid #e2e8f0;padding-top:7px;margin-top:5px">'+

function openDebtModal(type){
  document.getElementById('modal-title').textContent=type==='customer'?'💰 دين على عميل':'💸 دين لمورد';
  document.getElementById('modal-body').innerHTML=
    acField('debt-name',type==='customer'?'اسم العميل':'اسم المورد','text','','','customers')+

    fld('debt-total','المبلغ الكلي (ج)','number','','',true)+
    fld('debt-paid','المدفوع الآن (ج)','number','0')+
    dateField('debt-date','📅 التاريخ',null)+
    '<div class="modal-actions"><button class="btn btn-'+(type==='customer'?'primary':'red')+' btn-full" onclick="saveDebt(\''+type+'\')">إضافة</button><button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button></div>';

async function saveDebt(type){
  var name=v('debt-name'),total=+v('debt-total');
  if(!name)return showToast('⚠️ الاسم مطلوب','#dc2626');
  if(!total||total<=0)return showToast('⚠️ المبلغ غير صحيح','#dc2626');
  var paid=+v('debt-paid')||0;
  var descVal=v('debt-desc');
  var obj={id:genId(),type:type,name:name,desc:descVal,details:descVal,total:total,paid:paid,date:v('debt-date'),payments:paid>0?[{amount:paid,date:v('debt-date')}]:[]};
  DB.debts.unshift(obj);
  await dbUpsert('debts',obj);
  addArchive(type==='customer'?'customers':'suppliers',name);
  await persist();
  closeModal();renderDebts();
  showToast('✅ تم إضافة الدين','#16a34a');
}

async function saveEditDebt(id){

function openPayDebtModal(id){

async function payDebt(id){
  var amount=+v('pay-amount');
  if(!amount||amount<=0)return showToast('⚠️ المبلغ غير صحيح','#dc2626');
  var d=DB.debts.find(function(x){return x.id===id;});if(!d)return;
  var newPaid=Math.min((d.paid||0)+amount,d.total);
  var payments=(d.payments||[]).concat([{amount:amount,date:v('pay-date')}]);
  var update={paid:newPaid,payments:payments};
  DB.debts=DB.debts.map(function(x){return x.id===id?Object.assign({},x,update):x;});
  await dbUpdate('debts',id,update);
  closeModal();renderDebts();renderHome();
  showToast('✅ تم تسجيل السداد','#16a34a');
}

function renderTasks(){
  var list=[].concat(DB.tasks).sort(function(a,b){
    var order={'عاجل':0,'متوسط':1,'عادي':2};
    if(a.status==='done'&&b.status!=='done')return 1;
    if(b.status==='done'&&a.status!=='done')return -1;
    // الجديد فوق
    return b.id>a.id?1:-1;
  });
  var el=document.getElementById('tasks-list');if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty">لا توجد مهمات</div>';return;}
  var pc=function(p){return p==='عاجل'?'#dc2626':p==='متوسط'?'#ca8a04':'#16a34a';};
  el.innerHTML=list.map(function(t){
    var isDone=t.status==='done';
    return '<div class="task-card" style="border-right:4px solid '+(isDone?'#94a3b8':pc(t.priority))+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
      '<div style="flex:1">'+
      '<div style="font-weight:800;font-size:15px;color:'+(isDone?'#94a3b8':'#0f172a')+';text-decoration:'+(isDone?'line-through':'none')+'">'+esc(t.title)+'</div>'+
      ((t.desc||t.details)?'<div class="item-sub">'+esc(t.desc||t.details)+'</div>':'')+
      (t.due_date?'<div class="item-sub" style="color:#ea580c">📅 '+esc(fmtDate(t.due_date))+'</div>':'')+
      (isDone&&t.done_at?'<div class="item-sub" style="color:#16a34a">✅ أُنجزت: '+esc(fmtDate(t.done_at.slice(0,10)))+'</div>':'')+
      '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+
      '<span class="badge" style="background:'+pc(t.priority)+'22;color:'+pc(t.priority)+'">'+esc(t.priority)+'</span>'+
      (isDone?'<span class="badge" style="background:#dcfce7;color:#16a34a">✅ منجزة</span>':'')+
      '</div></div>'+
      '<div style="display:flex;gap:5px">'+
      (!isDone?'<button class="btn-ic" style="background:#dcfce7" onclick="openMarkDoneModal(\''+t.id+'\')">✅</button>':'')+
      '<button class="btn-ic" style="background:#dbeafe" onclick="openTaskModal(\''+t.id+'\')">✏️</button>'+
      '<button class="btn-ic" style="background:#fee2e2" onclick="confirmAction(\'هتحذف المهمة دي؟\',function(){delItem(\'tasks\',\''+t.id+'\',renderTasks)})">🗑️</button>'+
      '</div></div></div>';
  }).join('');
}

var _taskId=null;
function openTaskModal(id){
  _taskId=id||null;
  var t=id?DB.tasks.find(function(x){return x.id===id;}):null;
  document.getElementById('modal-title').textContent=t?'تعديل المهمة':'مهمة جديدة';
  document.getElementById('modal-body').innerHTML=
    fld('task-title','عنوان المهمة','text',t?t.title:'','',true)+
    fld('task-desc','تفاصيل (اختياري)','text',t?t.desc||t.details||'':'')+
    '<div class="field"><label>الأولوية</label><select id="task-priority" style="width:100%;padding:10px 13px;border:2px solid #e2e8f0;border-radius:11px;font-size:14px;font-family:inherit">'+
    ['عاجل','متوسط','عادي'].map(function(p){return '<option value="'+p+'"'+(t&&t.priority===p?' selected':(!t&&p==='متوسط'?' selected':''))+'>'+p+'</option>';}).join('')+
    '</select></div>'+
    dateField('task-due','📅 تاريخ الاستحقاق',t?t.due_date:null)+
    '<div class="modal-actions"><button class="btn btn-primary btn-full" onclick="saveTask()">'+(t?'حفظ':'إضافة')+'</button><button class="btn btn-outline btn-full" onclick="closeModal()">إلغاء</button></div>';
  openModal();
}

async function saveTask(){
  var title=v('task-title');
  if(!title)return showToast('⚠️ عنوان المهمة مطلوب','#dc2626');
  var obj={title:title,details:v('task-desc'),desc:v('task-desc'),priority:v('task-priority'),due_date:v('task-due'),status:'pending'};
  if(_taskId){
    DB.tasks=DB.tasks.map(function(t){return t.id===_taskId?Object.assign({},t,obj):t;});
    await dbUpdate('tasks',_taskId,obj);
  }else{
    obj.id=genId();
    DB.tasks.unshift(obj); // الجديد فوق
    await dbUpsert('tasks',obj);
  }
  closeModal();renderTasks();renderHome();
  showToast(_taskId?'✅ تم التعديل':'✅ تم إضافة المهمة','#16a34a');
}

function daysBetween(a,b){
  if(!a||!b)return 0;
  return Math.max(0,Math.round((new Date(b)-new Date(a))/(1000*60*60*24)));
}

function getFaultTypes(){
  var saved=LS.get('mc8_fault_types',[]);
  return saved;
}

function sortedMovements(){
  var list=[].concat(DB.movements||[]);
  var schedOrder={};
  var week=getWeekDates();
  week.forEach(function(dateStr,dayIdx){
    (DB.schedule[dateStr]||[]).forEach(function(id,pos){
      if(!schedOrder[id])schedOrder[id]={dayIdx:dayIdx,pos:pos};
    });
  });
  list.sort(function(a,b){
    var aDone=a.status==='منتهي',bDone=b.status==='منتهي';
    if(aDone&&!bDone)return 1;
    if(!aDone&&bDone)return -1;
    var sa=schedOrder[a.id],sb=schedOrder[b.id];
    if(sa&&sb){if(sa.dayIdx!==sb.dayIdx)return sa.dayIdx-sb.dayIdx;return sa.pos-sb.pos;}
    if(sa&&!sb)return -1;
    if(!sa&&sb)return 1;
    return b.id>a.id?1:-1;
  });
  return list;
}

async function saveMovement(){
  var customer=v('mov-customer');
  if(!customer)return showToast('⚠️ اسم العميل مطلوب','#dc2626');
  var status=v('mov-status');
  var isNewlyDone=status==='منتهي'&&(!_movId||(DB.movements.find(function(m){return m.id===_movId;})||{}).status!=='منتهي');
  var obj={customer:customer,device:v('mov-device'),serial:v('mov-serial'),
    fault_type:v('mov-fault-input'),fault_desc:v('mov-desc'),
    status:status,parts:_movParts.slice(),opened_at:v('mov-date')||today()};
  if(isNewlyDone){obj.closed_at=today();obj.closed_order=Date.now();}
  if(_movId){
    DB.movements=DB.movements.map(function(m){return m.id===_movId?Object.assign({},m,obj):m;});
    await dbUpdate('movements',_movId,obj);
  }else{
    DB.movCounter=(DB.movCounter||0)+1;
    obj.id=genId();obj.log=[];obj.seq_num=DB.movCounter;
    DB.movements.unshift(obj);
    await dbUpsert('movements',obj);
    await persist();
  }
  addArchive('customers',customer);
  closeModal();renderMovements();renderHome();
  showToast(_movId?'✅ تم التعديل':'✅ تم تسجيل العطل #'+DB.movCounter,'#16a34a');
}

async function saveLog(id){
  var note=v('log-note');if(!note.trim())return showToast('⚠️ اكتب ملاحظة','#dc2626');
  var newStatus=v('log-status');
  var update={};
  DB.movements=DB.movements.map(function(m){
    if(m.id!==id)return m;
    var log=(m.log||[]).concat([{date:today(),note:note}]);
    update={log:log,status:newStatus};
    if(newStatus==='منتهي'&&m.status!=='منتهي'){update.closed_at=today();update.closed_order=Date.now();}
    return Object.assign({},m,update);
  });
  await dbUpdate('movements',id,update);
  closeModal();renderMovements();renderHome();
  showToast(newStatus==='منتهي'?'🎉 تم إنهاء العطل':'✅ تم التحديث','#16a34a');
}

}

function renderMovementsReport(){
  var el=document.getElementById('movements-report-body');if(!el)return;
  var list=DB.movements||[];
  if(!list.length){el.innerHTML='<div style="padding:14px 12px"><div class="empty">لا توجد بيانات</div></div>';return;}
  var todayStr=today(),monthStr=todayStr.slice(0,7),yearStr=todayStr.slice(0,4);
  var todayList=list.filter(function(m){return m.opened_at===todayStr||m.closed_at===todayStr;});
  var monthList=list.filter(function(m){return(m.opened_at||'').slice(0,7)===monthStr;});
  var yearList=list.filter(function(m){return(m.opened_at||'').slice(0,4)===yearStr;});
  function avgDays(arr){
    var done=arr.filter(function(m){return m.status==='منتهي'&&m.opened_at&&m.closed_at;});
    if(!done.length)return null;
    return Math.round(done.reduce(function(s,m){return s+daysBetween(m.opened_at,m.closed_at);},0)/done.length*10)/10;
  }
  function topFaults(arr){
    var map={};arr.forEach(function(m){if(m.fault_type)map[m.fault_type]=(map[m.fault_type]||0)+1;});
    var colors=['#86198f','#2563eb','#ea580c','#15803d','#ca8a04'];
    return Object.keys(map).sort(function(a,b){return map[b]-map[a];}).map(function(k,i){
      return{name:k,count:map[k],pct:arr.length?Math.round(map[k]/arr.length*100):0,color:colors[i%5]};
    });
  }
  function topList(arr,key,label){
    var map={};arr.forEach(function(m){var v=m[key];if(v)map[v]=(map[v]||0)+1;});
    var sorted=Object.keys(map).sort(function(a,b){return map[b]-map[a];}).slice(0,5);
    if(!sorted.length)return '';
    return '<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:6px">'+label+'</div>'+
      sorted.map(function(k,i){return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f5f9">'+
        '<span>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ')+' '+esc(k)+'</span><b>'+map[k]+'</b></div>';}).join('')+'</div>';
  }
  function periodSection(title,arr,color){
    if(!arr.length)return '';
    var done=arr.filter(function(m){return m.status==='منتهي';}).length;
    var open=arr.filter(function(m){return m.status!=='منتهي';}).length;
    var avg=avgDays(arr);var faults=topFaults(arr);var top=faults[0];
    return '<div class="card" style="margin-bottom:12px">'+
      '<div style="font-weight:900;font-size:15px;color:'+color+';margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid '+color+'">'+title+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">'+
      movMini('إجمالي',arr.length,color,'#f8fafc')+movMini('منتهي',done,'#15803d','#dcfce7')+movMini('جاري',open,'#ca8a04','#fef9c3')+
      '</div>'+
      (avg!==null?'<div style="background:#f8fafc;border-radius:9px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700">⏱️ متوسط وقت الإصلاح</span><span style="font-size:20px;font-weight:900;color:'+color+'">'+avg+' <span style="font-size:12px">يوم</span></span></div>':'')+
      (top?'<div style="background:'+top.color+'11;border:1.5px solid '+top.color+'33;border-radius:9px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;color:#64748b;font-weight:700">🏆 أكثر عطل</div><div style="font-size:14px;font-weight:900;color:'+top.color+';margin-top:3px">'+esc(top.name)+'</div></div><div style="text-align:left"><div style="font-size:22px;font-weight:900;color:'+top.color+'">'+top.count+'</div><div style="font-size:10px;color:#94a3b8">'+top.pct+'%</div></div></div>':'')+
      '<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">📊 توزيع الأعطال:</div>'+
      faults.map(function(f){return '<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>'+esc(f.name)+'</span><b style="color:'+f.color+'">'+f.count+' ('+f.pct+'%)</b></div><div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+f.pct+'%;background:'+f.color+';border-radius:3px"></div></div></div>';}).join('')+'</div>'+
      topList(arr,'device','🖨️ أكثر أجهزة:')+topList(arr,'customer','👤 أكثر عملاء:')+
      '</div>';
  }
  el.innerHTML='<div style="padding:14px 12px 88px">'+
    periodSection('📅 اليوم — '+fmtDate(todayStr),todayList,'#2563eb')+
    periodSection('📆 هذا الشهر',monthList,'#86198f')+
    periodSection('🗓️ هذا العام',yearList,'#ea580c')+'</div>';
}

// ===== SCHEDULE =====
function getWeekDates(){
  var now=new Date(),day=now.getDay(),diff=(day-6+7)%7,dates=[];
  for(var i=0;i<7;i++){var d=new Date(now);d.setDate(now.getDate()-diff+i);dates.push(d.toISOString().split('T')[0]);}
  return dates;
}

async function changeMovStatusFromSchedule(id, newStatus){
  var m=DB.movements.find(function(x){return x.id===id;});if(!m)return;
  if(m.status===newStatus)return;
  var update={status:newStatus};
  if(newStatus==='منتهي'&&m.status!=='منتهي'){update.closed_at=today();update.closed_order=Date.now();}
  DB.movements=DB.movements.map(function(x){return x.id===id?Object.assign({},x,update):x;});
  await dbUpdate('movements',id,update);
  renderSchedule();renderHome();
  showToast('✅ تم تحديث الحالة','#16a34a');
}

// تحويل الأعطال الغير منتهية لليوم التالي
function autoRollOver(){
  var todayStr=today();
  var week=getWeekDates();
  week.forEach(function(dateStr){
    if(dateStr>=todayStr)return; // الماضي فقط
    var ids=DB.schedule[dateStr]||[];
    ids.forEach(function(id){
      var m=(DB.movements||[]).find(function(x){return x.id===id;});
      if(!m||m.status==='منتهي')return;
      // ابحث عن اليوم التالي في الجدول
      var nextDay=getNextDay(dateStr);
      if(!nextDay||nextDay>todayStr)return;
      var nextIds=DB.schedule[nextDay]||[];
      if(nextIds.indexOf(id)===-1){
        nextIds.push(id);
        DB.schedule[nextDay]=nextIds;
        LS.set('mc8_schedule',DB.schedule);
        persist();
      }
    });
  });
}

function getNextDay(dateStr){
  var d=new Date(dateStr);d.setDate(d.getDate()+1);return d.toISOString().split('T')[0];
}

var _schedChecked=[];
function toggleSchedCheck(id,el){
  var chk=document.getElementById('schk-'+id);
  var idx=_schedChecked.indexOf(id);
  if(idx===-1){_schedChecked.push(id);chk.style.background='#2563eb';chk.style.borderColor='#2563eb';chk.innerHTML='<span style="color:#fff;font-size:12px">✓</span>';el.style.background='#eff6ff';el.style.border='1.5px solid #bfdbfe';}
  else{_schedChecked.splice(idx,1);chk.style.background='#fff';chk.style.borderColor='#e2e8f0';chk.innerHTML='';el.style.background='#f8fafc';el.style.border='none';}

async function confirmAddToSchedule(dateStr){
  if(!_schedChecked.length)return showToast('⚠️ اختار عطل واحد على الأقل','#dc2626');
  var cur=DB.schedule[dateStr]||[];
  _schedChecked.forEach(function(id){if(cur.indexOf(id)===-1)cur.push(id);});
  DB.schedule[dateStr]=cur;_schedChecked=[];
  await persist();
  closeModal();renderSchedule();showToast('✅ تم الإضافة','#16a34a');
}

async function removeFromSchedule(dateStr,id){
  if(!DB.schedule||!DB.schedule[dateStr])return;
  DB.schedule[dateStr]=DB.schedule[dateStr].filter(function(x){return x!==id;});
  await persist();renderSchedule();
}

var _dragDate=null,_dragId=null,_dragEl=null;
function schedDragStart(e,dateStr,id){_dragDate=dateStr;_dragId=id;_dragEl=e.target.closest('[draggable]');e.dataTransfer.effectAllowed='move';setTimeout(function(){if(_dragEl)_dragEl.style.opacity='0.4';},0);}
function schedDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
async function schedDrop(e,dateStr,targetIdx){
  e.preventDefault();if(!_dragDate||_dragDate!==dateStr)return;
  var ids=DB.schedule[dateStr]||[];
  var fromIdx=ids.indexOf(_dragId);if(fromIdx===-1||fromIdx===targetIdx)return;
  ids.splice(fromIdx,1);ids.splice(targetIdx,0,_dragId);
  DB.schedule[dateStr]=ids;await persist();renderSchedule();
}
function schedDragEnd(e){if(_dragEl)_dragEl.style.opacity='1';_dragDate=null;_dragId=null;_dragEl=null;}

function updateMovementsBadge(){

}

// ===== REPORTS =====
var _reportFrom='',_reportTo='';

function renderReports(){
  if(!_reportFrom){var d=new Date();_reportFrom=new Date(d.getFullYear(),d.getMonth(),1).toISOString().split('T')[0];_reportTo=today();}
  var tab=currentReportTab||'period';
  ['period','income','balance','expenses','analysis'].forEach(function(t){
    var el=document.getElementById('tab-'+t);if(el)el.style.display=t===tab?'block':'none';
  });
  if(tab==='period')renderPeriodReport();
  else if(tab==='income')renderIncomeReport();
  else if(tab==='balance')renderBalanceReport();
  else if(tab==='expenses')renderExpensesReport();
  else if(tab==='analysis')renderFullAnalysis();
}

function setDateFilter(from,to,el){
  _reportFrom=from;_reportTo=to;
  document.querySelectorAll('.df-btn').forEach(function(b){b.classList.remove('active');});
  if(el)el.classList.add('active');
  renderReports();
}

function filterSalesByPeriod(){return DB.sales.filter(function(s){return(!_reportFrom||s.date>=_reportFrom)&&(!_reportTo||s.date<=_reportTo);});}
function filterPurchByPeriod(){return DB.purchases.filter(function(p){return(!_reportFrom||p.date>=_reportFrom)&&(!_reportTo||p.date<=_reportTo);});}
function filterExpByPeriod(){return DB.expenses.filter(function(e){return(!_reportFrom||e.date>=_reportFrom)&&(!_reportTo||e.date<=_reportTo);});}

function kpiCard(label,val,color,bg){
  return '<div style="background:'+bg+';border-radius:12px;padding:12px 10px;text-align:center">'+
    '<div style="font-size:10px;font-weight:700;color:'+color+';margin-bottom:4px">'+label+'</div>'+
    '<div style="font-size:13px;font-weight:900;color:'+color+'">'+val+'</div></div>';
}

function accountRow(label,sub,total,type){
  var isTitle=type&&type.includes('title'),isTotal=type&&type.includes('total');
  var isIndent=type&&type.includes('indent'),isRed=type&&type.includes('red'),isGreen=type&&type.includes('green');
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:'+(isTitle?'8px 0 4px':'6px 0')+';'+(isTotal?'border-top:1.5px solid #e2e8f0;margin-top:2px;':'')+(isIndent?'padding-right:14px;':'')+'border-bottom:'+(isTitle||isTotal?'none':'1px solid #f8fafc')+'">'+
    '<span style="font-size:'+(isTitle?'11':'13')+'px;font-weight:'+(isTitle?'800':isTotal?'900':'400')+';color:'+(isTitle?'#94a3b8':'#374151')+'">'+label+(sub?'<span style="font-size:11px;color:#94a3b8;margin-right:4px">'+sub+'</span>':'')+'</span>'+
    (total?'<span style="font-size:'+(isTotal?'14':'13')+'px;font-weight:900;color:'+(isRed?'#dc2626':isGreen?'#15803d':'#0f172a')+'">'+total+'</span>':'<span></span>')+
    '</div>';
}

function statRow(label,val,color){
  return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px">'+
    '<span style="color:#64748b">'+label+'</span><b style="color:'+(color||'#0f172a')+'">'+val+'</b></div>';
}

// ===== قائمة الدخل =====
function renderPeriodReport(){
  var ps=filterSalesByPeriod(),pe=filterExpByPeriod();
  var rev=ps.reduce(function(s,x){return s+x.total;},0);
  var cos=ps.reduce(function(s,sale){return s+(sale.items||[]).reduce(function(ss,item){return ss+item.qty*(item.buyPrice||item.buy_price||0);},0);},0);
  var srvRev=ps.reduce(function(s,sale){return s+(sale.services||[]).reduce(function(ss,sv){return ss+sv.price;},0);},0);
  var grossProfit=rev-cos,grossPct=rev>0?Math.round(grossProfit/rev*100):0;
  var expByType={};pe.forEach(function(e){expByType[e.type]=(expByType[e.type]||0)+e.amount;});
  var exp=pe.reduce(function(s,x){return s+x.amount;},0);
  var netProfit=grossProfit-exp,netPct=rev>0?Math.round(netProfit/rev*100):0;
  var el=document.getElementById('tab-period');if(!el)return;
  el.innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'+
    kpiCard('💰 الإيرادات',fmt(rev),'#2563eb','#dbeafe')+
    kpiCard('🛒 تكلفة البضاعة',fmt(cos),'#7c3aed','#ede9fe')+
    kpiCard('📈 مجمل الربح',fmt(grossProfit)+' ('+grossPct+'%)',grossProfit>=0?'#15803d':'#dc2626',grossProfit>=0?'#dcfce7':'#fee2e2')+
    kpiCard('💸 المصروفات',fmt(exp),'#ea580c','#fff7ed')+
    '</div>'+
    '<div class="card">'+
    '<div style="font-weight:900;font-size:14px;color:#0f172a;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #0f172a">📊 قائمة الدخل</div>'+
    accountRow('الإيرادات','','','title')+
    accountRow('إيرادات المبيعات',fmt(rev-srvRev),'','indent')+
    (srvRev>0?accountRow('إيرادات الخدمات',fmt(srvRev),'','indent'):'')+
    accountRow('إجمالي الإيرادات','',fmt(rev),'total')+
    '<div style="height:8px"></div>'+
    accountRow('تكلفة المبيعات','','','title')+
    accountRow('تكلفة البضاعة المباعة','('+fmt(cos)+')','','indent red')+
    accountRow('مجمل الربح','',fmt(grossProfit),'total '+(grossProfit>=0?'green':'red'))+
    '<div style="font-size:11px;color:#64748b;text-align:left;margin:-4px 0 10px 4px">نسبة المجمل: '+grossPct+'%</div>'+
    '<div style="height:8px"></div>'+
    accountRow('المصروفات التشغيلية','','','title')+
    Object.keys(expByType).map(function(k){
      return accountRow(k,'('+fmt(expByType[k])+')','','indent red');
    }).join('')+
    accountRow('إجمالي المصروفات','('+fmt(exp)+')','','total red')+
    '<div style="height:8px"></div>'+
    '<div style="background:'+(netProfit>=0?'#f0fdf4':'#fef2f2')+';border-radius:11px;padding:14px;margin-top:4px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="font-weight:900;font-size:15px">صافي الربح</div>'+
    '<div style="font-size:11px;color:#64748b">نسبة الصافي: '+netPct+'%</div></div>'+
    '<div style="font-size:20px;font-weight:900;color:'+(netProfit>=0?'#15803d':'#dc2626')+'">'+fmt(netProfit)+'</div></div></div>'+
    '</div>'+
    // تعديل سريع
    '<div class="card" style="margin-top:8px">'+
    '<div style="font-weight:900;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<span>📋 إحصائيات</span></div>'+
    statRow('عدد الفواتير',ps.length+' فاتورة')+
    statRow('متوسط الفاتورة',ps.length?fmt(Math.round(rev/ps.length)):fmt(0))+
    statRow('إجمالي المشتريات',fmt(filterPurchByPeriod().reduce(function(s,x){return s+x.total;},0)))+
    '</div>';
}

// ===== التحصيل =====
function renderIncomeReport(){
  var ps=filterSalesByPeriod();
  var byStatus={'مدفوع':0,'جزئي':0,'غير مدفوع':0};
  ps.forEach(function(s){byStatus[s.status]=(byStatus[s.status]||0)+s.total;});
  var totalCollected=ps.reduce(function(s,x){return s+(x.paid||0);},0);
  var totalPending=ps.reduce(function(s,x){return s+(x.total-(x.paid||0));},0);
  var el=document.getElementById('tab-income');if(!el)return;
  el.innerHTML='<div class="card">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #0f172a">💰 تحليل التحصيل</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px">'+
    '<div style="background:#dcfce7;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#15803d;font-weight:700">مدفوع</div><div style="font-weight:900;color:#15803d;font-size:13px">'+fmt(byStatus['مدفوع'])+'</div></div>'+
    '<div style="background:#fef9c3;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#ca8a04;font-weight:700">جزئي</div><div style="font-weight:900;color:#ca8a04;font-size:13px">'+fmt(byStatus['جزئي'])+'</div></div>'+
    '<div style="background:#fee2e2;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#dc2626;font-weight:700">غير مدفوع</div><div style="font-weight:900;color:#dc2626;font-size:13px">'+fmt(byStatus['غير مدفوع'])+'</div></div>'+
    '</div>'+
    statRow('إجمالي المحصّل',fmt(totalCollected),'#15803d')+
    statRow('إجمالي المعلّق',fmt(totalPending),'#dc2626')+

    '<div class="card">'+
    '<div style="font-weight:900;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between">'+
    '<span>🧾 الفواتير ('+ps.length+')</span>'+

        '<div><div style="font-size:13px;font-weight:700">'+esc(s.customer)+'</div>'+
        '<div style="font-size:11px;color:#94a3b8">'+esc(fmtDate(s.date))+'</div></div>'+
        '<div style="text-align:left;display:flex;align-items:center;gap:6px">'+
        '<div style="font-weight:700;font-size:13px">'+fmt(s.total)+'</div>'+
        '<span style="background:'+bg+';color:'+sc+';border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700">'+s.status+'</span>'+

// ===== المركز المالي =====
function renderBalanceReport(){
  var assets=DB.products.reduce(function(s,p){return s+p.qty*(p.buy_price||0);},0);
  var custDebt=DB.debts.filter(function(d){return d.type==='customer';}).reduce(function(s,d){return s+(d.total-(d.paid||0));},0);
  var suppDebt=DB.debts.filter(function(d){return d.type==='supplier';}).reduce(function(s,d){return s+(d.total-(d.paid||0));},0);
  var capital=(DB.accounts&&DB.accounts.capital||[]).reduce(function(s,c){return s+c.amount;},0);
  var fixedAssets=(DB.accounts&&DB.accounts.fixed_assets||[]).reduce(function(s,a){return s+a.value;},0);
  var receivables=(DB.accounts&&DB.accounts.receivables||[]).filter(function(r){return r.status==='pending';}).reduce(function(s,r){return s+r.amount;},0);
  var net=assets+custDebt+capital+fixedAssets+receivables-suppDebt;
  var el=document.getElementById('tab-balance');if(!el)return;
  el.innerHTML='<div class="card">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #0f172a">📊 قائمة المركز المالي</div>'+
    '<div style="font-weight:800;font-size:11px;color:#2563eb;margin-bottom:6px;margin-top:4px">الأصول</div>'+
    statRow('رأس المال المستثمر',fmt(capital),'#2563eb')+
    statRow('الأصول الثابتة',fmt(fixedAssets),'#7c3aed')+
    statRow('قيمة المخزون',fmt(assets),'#0d9488')+
    statRow('ديون العملاء (لي)',fmt(custDebt),'#2563eb')+
    statRow('مستحقات',fmt(receivables),'#ca8a04')+
    '<div style="display:flex;justify-content:space-between;padding:9px 0;font-weight:900;font-size:14px;border-top:2px solid #2563eb;margin-top:4px"><span>إجمالي الأصول</span><span style="color:#2563eb">'+fmt(assets+custDebt+capital+fixedAssets+receivables)+'</span></div>'+
    '<div style="height:10px"></div>'+

// ===== التحليل المالي الكامل =====
function renderFullAnalysis(){
  var ps=DB.sales, pe=DB.expenses, pp=DB.purchases;
  var el=document.getElementById('tab-analysis');if(!el)return;

  var rev=ps.reduce(function(s,x){return s+x.total;},0);
  var cos=ps.reduce(function(s,sale){return s+(sale.items||[]).reduce(function(ss,i){return ss+i.qty*(i.buyPrice||i.buy_price||0);},0);},0);
  var exp=pe.reduce(function(s,x){return s+x.amount;},0);
  var grossProfit=rev-cos;
  var netProfit=grossProfit-exp;
  var grossMargin=rev>0?Math.round(grossProfit/rev*100):0;
  var netMargin=rev>0?Math.round(netProfit/rev*100):0;

  // نقطة التعادل
  var fixedExp=(DB.accounts&&DB.accounts.fixed_expenses||[]).filter(function(e){return e.active!==false&&e.type==='fixed';}).reduce(function(s,e){return s+e.amount;},0);
  var breakEven=grossMargin>0?Math.round(fixedExp/(grossMargin/100)):0;

  // التدفق النقدي
  var collected=ps.reduce(function(s,x){return s+(x.paid||0);},0);
  var paid=pp.reduce(function(s,x){return s+(x.paid||0);},0)+exp;
  var cashFlow=collected-paid;

  // مؤشرات الأداء
  var avgTicket=ps.length?Math.round(rev/ps.length):0;
  var repeatCustomers={};
  ps.forEach(function(s){repeatCustomers[s.customer]=(repeatCustomers[s.customer]||0)+1;});
  var repeats=Object.values(repeatCustomers).filter(function(v){return v>1;}).length;

  // شهري
  var monthlyRev={};
  ps.forEach(function(s){
    if(!s.date)return;
    var m=s.date.slice(0,7);
    monthlyRev[m]=(monthlyRev[m]||0)+s.total;
  });
  var months=Object.keys(monthlyRev).sort();
  var maxMonth=months.reduce(function(a,b){return monthlyRev[a]>monthlyRev[b]?a:b;},'');

  el.innerHTML=
    // مؤشرات الأداء الرئيسية
    '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #0f172a">🎯 مؤشرات الأداء الرئيسية</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
    kpiCard('هامش المجمل',grossMargin+'%',grossMargin>=30?'#15803d':'#ca8a04',grossMargin>=30?'#dcfce7':'#fef9c3')+
    kpiCard('هامش الصافي',netMargin+'%',netMargin>=15?'#15803d':netMargin>=0?'#ca8a04':'#dc2626',netMargin>=15?'#dcfce7':netMargin>=0?'#fef9c3':'#fee2e2')+
    kpiCard('متوسط الفاتورة',fmt(avgTicket),'#2563eb','#dbeafe')+
    kpiCard('عملاء متكررون',repeats,'#7c3aed','#ede9fe')+
    '</div>'+
    '</div>'+

    // نقطة التعادل
    '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #ea580c">⚖️ نقطة التعادل</div>'+
    '<div style="background:#fff7ed;border-radius:11px;padding:14px;margin-bottom:10px">'+
    '<div style="font-size:11px;color:#ea580c;font-weight:700;margin-bottom:4px">المبيعات المطلوبة للتعادل / شهر</div>'+
    '<div style="font-size:24px;font-weight:900;color:#ea580c">'+fmt(breakEven)+'</div>'+
    '<div style="font-size:11px;color:#94a3b8;margin-top:3px">بناءً على المصاريف الثابتة '+fmt(fixedExp)+' وهامش '+grossMargin+'%</div></div>'+
    statRow('المبيعات الفعلية',fmt(rev),rev>=breakEven?'#15803d':'#dc2626')+
    '<div style="background:'+(rev>=breakEven?'#dcfce7':'#fee2e2')+';border-radius:9px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-size:13px;font-weight:700">'+(rev>=breakEven?'✅ تجاوزت نقطة التعادل':'⚠️ لم تصل لنقطة التعادل')+'</span>'+
    '<span style="font-weight:900;font-size:14px;color:'+(rev>=breakEven?'#15803d':'#dc2626')+'">'+fmt(Math.abs(rev-breakEven))+'</span></div>'+
    '</div>'+

    // التدفق النقدي
    '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #2563eb">💧 التدفق النقدي</div>'+
    statRow('إجمالي المحصّل',fmt(collected),'#15803d')+
    statRow('إجمالي المدفوع',fmt(paid),'#dc2626')+
    '<div style="background:'+(cashFlow>=0?'#f0fdf4':'#fef2f2')+';border-radius:10px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-weight:900">صافي التدفق النقدي</span>'+
    '<span style="font-weight:900;font-size:18px;color:'+(cashFlow>=0?'#15803d':'#dc2626')+'">'+fmt(cashFlow)+'</span></div>'+
    '</div>'+

    // الأداء الشهري
    (months.length?'<div class="card" style="margin-bottom:10px">'+
    '<div style="font-weight:900;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #7c3aed">📅 الأداء الشهري</div>'+
    (maxMonth?'<div style="background:#ede9fe;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="font-size:11px;color:#7c3aed;font-weight:700">🏆 أفضل شهر</div>'+
    '<div style="font-size:14px;font-weight:900;color:#7c3aed">'+maxMonth+'</div></div>'+
    '<div style="font-size:18px;font-weight:900;color:#7c3aed">'+fmt(monthlyRev[maxMonth])+'</div></div>':'')+
    months.slice(-6).reverse().map(function(m){
      var pct=monthlyRev[maxMonth]>0?Math.round(monthlyRev[m]/monthlyRev[maxMonth]*100):0;
      return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>'+m+'</span><b>'+fmt(monthlyRev[m])+'</b></div>'+
        '<div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#7c3aed;border-radius:3px"></div></div></div>';
    }).join('')+'</div>':'');
}

function formatBackupDate(iso){
  try{
    var d=new Date(iso);
    var days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    return days[d.getDay()]+' '+d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})+' الساعة '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return iso;}
}

function setBackupInterval(minutes){
  AUTO_BACKUP_MINUTES=minutes;
  LS.set('mc8_backup_interval',minutes);
  startAutoBackup();
}

function exportBackup(){
  try{
    var data=Object.assign({},DB,{exportedAt:new Date().toISOString(),version:'9.0'});
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='mc-backup-'+today()+'.json';
    a.click();URL.revokeObjectURL(url);
    LS.set('mc8_last_backup',new Date().toISOString());
    showToast('✅ تم التصدير — تحقق من Downloads','#16a34a');
    renderSettings();
  }catch(e){showToast('❌ فشل التصدير','#dc2626');}
}

function importBackup(input){
  var file=input.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.sales&&!data.products)return showToast('❌ ملف غير صحيح','#dc2626');
      confirmAction('هتستبدل كل البيانات بالنسخة دي؟',function(){
        if(data.products)DB.products=data.products;
        if(data.sales)DB.sales=data.sales;
        if(data.purchases)DB.purchases=data.purchases;
        if(data.expenses)DB.expenses=data.expenses;
        if(data.debts)DB.debts=data.debts;
        if(data.tasks)DB.tasks=data.tasks;
        if(data.movements)DB.movements=data.movements;
        if(data.archive)DB.archive=data.archive;
        renderHome();renderSettings();
        showToast('✅ تم الاستيراد','#16a34a');
      });
    }catch(ex){showToast('❌ خطأ في الملف','#dc2626');}
  };
  r.readAsText(file);input.value='';
}

function exportCSV(){
  try{
    var rows=[['التاريخ','العميل','الموديل','السيريال','العداد','الإجمالي','المدفوع','الحالة','ملاحظة']];
    DB.sales.forEach(function(s){rows.push([s.date,s.customer,s.model||'',s.serial||'',s.counter||'',s.total,s.paid||0,s.status,s.note||'']);});
    var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='sales-'+today()+'.csv';
    a.click();URL.revokeObjectURL(url);
    showToast('✅ تم التصدير للإكسيل','#16a34a');
  }catch(e){showToast('❌ فشل التصدير','#dc2626');}
}

async function clearAllData(){
  DB.products=[];DB.sales=[];DB.purchases=[];DB.expenses=[];
  DB.debts=[];DB.tasks=[];DB.movements=[];
  DB.archive={customers:[],suppliers:[],products:[],expDescs:[],serials:[],models:[]};
  DB.schedule={};DB.movCounter=0;
  await persist();renderHome();navigate('home');
  showToast('🗑️ تم مسح كل البيانات','#64748b');
}

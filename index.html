      '<tbody>'+rows+srvRows+'</tbody></table>':'')+'<hr>'+
    '<div class="info-row" style="font-size:16px;font-weight:900"><span>الإجمالي</span><span>'+s.total+' ج</span></div>'+
    '<div class="info-row"><span>المدفوع</span><span style="color:green">'+( s.paid||0)+' ج</span></div>'+
    ((s.total-(s.paid||0))>0?'<div class="info-row"><span>المتبقي</span><span style="color:red">'+(s.total-(s.paid||0))+' ج</span></div>':'')+
    (s.note?'<div style="margin-top:10px;padding:8px;background:#f8fafc;border-radius:8px;font-size:12px"><b>ملاحظة:</b> '+esc(s.note)+'</div>':'')+
    '<br><button onclick="window.print()" style="width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-family:Tahoma">🖨️ طباعة</button>'+
    '</body></html>'
  );
  w.document.close();
}


// ===== MULTISELECT =====
// ===== MULTI SELECT =====
var _multiSelect = false;
var _multiTable = '';
var _selected = {};

function startMultiSelect(table){
  _multiSelect = true;
  _multiTable = table;
  _selected = {};
  renderScreen(currentScreen);
}

function cancelMultiSelect(){
  _multiSelect = false;
  _selected = {};
  renderScreen(currentScreen);
}

function toggleSelect(id){
  if(_selected[id]) delete _selected[id];
  else _selected[id] = true;
  updateMsToolbar();
  // re-render just the selected state visually
  document.querySelectorAll('[data-id]').forEach(function(el){
    var isSelected = _selected[el.dataset.id];
    var chk = el.querySelector('.ms-check');
    if(chk){
      chk.style.background = isSelected ? '#2563eb' : '#fff';
      chk.style.borderColor = isSelected ? '#2563eb' : '#e2e8f0';
      chk.innerHTML = isSelected ? '<span style="color:#fff;font-size:12px">✓</span>' : '';
      el.style.border = isSelected ? '2px solid #2563eb' : '';
      el.style.background = isSelected ? '#eff6ff' : '';
    }
  });
}

function updateMsToolbar(){
  var bar = document.getElementById('ms-toolbar');
  if(!bar) return;
  var count = Object.keys(_selected).length;
  bar.innerHTML =
    '<span style="font-size:13px;font-weight:700">تم تحديد '+count+'</span>'+
    '<div style="display:flex;gap:6px;margin-right:auto">'+
    (count>0?'<button class="btn btn-sm btn-red" onclick="deleteSelected()">🗑️ حذف ('+count+')</button>':'')+ 
    (count>0?'<button class="btn btn-sm" style="background:#dcfce7;color:#15803d" onclick="exportSelected()">📤 تصدير</button>':'')+
    '<button class="btn btn-sm btn-outline" onclick="cancelMultiSelect()">إلغاء</button>'+
    '</div>';
  bar.style.display = 'flex';
}

async function deleteSelected(){
  var ids = Object.keys(_selected);
  if(!ids.length) return;
  confirmAction('هتحذف '+ids.length+' عنصر؟', async function(){
    for(var i=0;i<ids.length;i++){
      DB[_multiTable] = DB[_multiTable].filter(function(x){return x.id!==ids[i];});
      await dbDelete(_multiTable, ids[i]);
    }
    cancelMultiSelect();
    renderHome();
    showToast('🗑️ تم حذف '+ids.length+' عنصر','#64748b');
  });
}

function exportSelected(){
  var ids = Object.keys(_selected);
  if(!ids.length) return;
  var items = DB[_multiTable].filter(function(x){return ids.indexOf(x.id)!==-1;});
  var blob = new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=_multiTable+'-export-'+today()+'.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('✅ تم تصدير '+items.length+' عنصر','#16a34a');
}

// Multi-select card wrapper helper
function msCard(id, innerHTML){
  var isSelected = _selected[id];
  return '<div class="card" data-id="'+id+'" style="'+(isSelected?'border:2px solid #2563eb !important;background:#eff6ff;':'')+';margin-bottom:10px">'+
    (_multiSelect?
      '<div style="display:flex;align-items:flex-start;gap:10px">'+
      '<div class="ms-check" onclick="toggleSelect(\''+id+'\')" style="width:22px;height:22px;border:2px solid '+(isSelected?'#2563eb':'#e2e8f0')+';border-radius:6px;flex-shrink:0;margin-top:2px;background:'+(isSelected?'#2563eb':'#fff')+';display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none">'+
      (isSelected?'<span style="color:#fff;font-size:12px">✓</span>':'')+
      '</div><div style="flex:1">'+innerHTML+'</div></div>'
    : innerHTML)+
    '</div>';
}
